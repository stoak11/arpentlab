<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Votre session d'essai Ceres · Arpent Lab</title>
  <link rel="icon" type="image/png" href="../assets/arpent-logo-brandbook.png">
  <style>
    :root { --anthracite: #1e242b; --gold: #c7a248; --terra: #b5623e; --paper: #fafaf8; --muted: #6f7881; --line: #dbdcd9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--anthracite);
           font-family: Inter, "Segoe UI", system-ui, sans-serif; line-height: 1.55; padding: 20px; }
    main { max-width: 520px; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 30px; }
    .eyebrow { font: 600 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    h1 { font-size: 1.5rem; margin: 10px 0 12px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: .92rem; }
    a.btn { display: inline-block; margin-top: 8px; padding: 12px 18px; border-radius: 8px; background: var(--terra); color: #fff; font-weight: 600; text-decoration: none; }
    .spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--terra); border-radius: 50%; animation: s 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
    @keyframes s { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Arpent Lab · Ceres</p>
    <h1>Votre session d'essai Ceres</h1>
    <div id="msg" aria-live="polite"><p><span class="spin" aria-hidden="true"></span>Ouverture de votre espace…</p></div>
  </main>
  <script>
    (async function () {
      var msg = document.getElementById("msg");
      var token = new URLSearchParams(location.search).get("token") || "";
      function show(html) { msg.innerHTML = html; }
      var contact = '<p class="muted">Une question ? <a href="mailto:contact@arpent-lab.ai?subject=Session%20d%27essai%20Ceres">contact@arpent-lab.ai</a></p>';
      try {
        var r = await fetch("../endpoints.json", { cache: "no-store" });
        var ep = r.ok ? await r.json() : {};
        var base = (ep.ceres_app || "").replace(/\/+$/, "");
        if (!base) throw new Error("no-endpoint");
        var target = token ? base + "/trial/activate?token=" + encodeURIComponent(token) : base + "/login";
        show('<p><span class="spin" aria-hidden="true"></span>Redirection vers votre espace Ceres…</p><p class="muted">Si rien ne se passe, <a href="' + target + '">cliquez ici</a>.</p>');
        location.replace(target);
      } catch (e) {
        show('<p>Votre espace Ceres est momentanément indisponible. Votre lien reste valable : réessayez dans quelques minutes.</p>' +
             '<a class="btn" href="">Réessayer</a>' + contact);
      }
    })();
  </script>
</body>
</html>
