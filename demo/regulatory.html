<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceres · Modules reglementaires · FarmCockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --anthracite:#1e242b; --gold:#c7a248; --terra:#b5623e; --paper:#fafaf8;
  --gris:#eaece8; --gris2:#d4d7d2; --ink:#2a2f36; --muted:#6b7280;
  --line:#e2e5e0; --line2:#cfd3cc; --ok:#2d7d46; --warn:#b8862f; --err:#a93829;
  --r:8px; --r-sm:5px; --r-lg:14px;
  --shadow:0 1px 3px rgba(30,36,43,.06),0 1px 2px rgba(30,36,43,.04);
  --shadow-md:0 4px 12px rgba(30,36,43,.08),0 2px 4px rgba(30,36,43,.04);
  --shadow-lg:0 12px 32px rgba(30,36,43,.12),0 4px 8px rgba(30,36,43,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:inherit;text-decoration:none}
::selection{background:rgba(199,162,72,.25)}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--anthracite);color:#c8cdd3;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.brand{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--gold),var(--terra));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--anthracite);font-family:var(--mono)}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.brand-sub{font-size:9px;color:rgba(255,255,255,.4);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.nav-group-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);font-family:var(--mono);padding:14px 14px 7px;display:block}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;color:rgba(255,255,255,.55);transition:all .12s;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.nav-item .ico{width:15px;height:15px;flex-shrink:0;opacity:.7;text-align:center}
.nav-count{margin-left:auto;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}
.sidebar-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:rgba(255,255,255,.3);font-family:var(--mono);line-height:1.6}
.sidebar-foot a{color:var(--gold);opacity:.7}
.sidebar-foot a:hover{opacity:1}

.main{overflow-y:auto;background:var(--paper)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--gris2);border-radius:3px}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.topbar-role{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-meta{font-size:11px;font-family:var(--mono);color:var(--muted)}
.topbar-btn{font-size:11px;font-family:var(--mono);color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:5px;transition:all .15s;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.topbar-btn:hover{border-color:var(--gold);color:var(--ink)}
.content{padding:24px;max-width:1320px}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite)}
.card-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card-body{padding:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ===== KPI ===== */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono)}
.kpi-val{font-size:26px;font-weight:600;font-family:var(--mono);margin:6px 0 2px;letter-spacing:-0.02em;color:var(--anthracite)}
.kpi-unit{font-size:13px;color:var(--muted);font-weight:400}
.kpi-delta{font-size:11px;font-family:var(--mono);margin-top:4px}
.kpi-delta.pos{color:var(--ok)}
.kpi-delta.neg{color:var(--err)}
.kpi-delta.neu{color:var(--muted)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r);background:var(--gris)}
.kpi.accent::before{background:var(--gold)}
.kpi.terra::before{background:var(--terra)}
.kpi.ok::before{background:var(--ok)}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(199,162,72,.03)}
.tbl td .mono{font-family:var(--mono);font-size:11px}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl-wrap{overflow-x:auto}
.row-clickable{cursor:pointer}

/* ===== Badges ===== */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.gold{background:rgba(199,162,72,.12);color:#8a7126;border:1px solid rgba(199,162,72,.2)}
.tag.terra{background:rgba(181,98,62,.1);color:#8a4a30;border:1px solid rgba(181,98,62,.2)}
.tag.ok{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.tag.warn{background:rgba(184,134,47,.1);color:var(--warn);border:1px solid rgba(184,134,47,.2)}
.tag.err{background:rgba(169,56,41,.08);color:var(--err);border:1px solid rgba(169,56,41,.15)}
.tag.neu{background:var(--gris);color:var(--muted);border:1px solid var(--line)}
.tag.info{background:rgba(107,155,216,.08);color:#4a7cb8;border:1px solid rgba(107,155,216,.15)}
.prov{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;font-weight:600}
.prov.saisi{background:rgba(45,125,70,.1);color:var(--ok)}
.prov.extrait{background:rgba(107,155,216,.1);color:#4a7cb8}
.prov.deduit{background:rgba(199,162,72,.12);color:#8a7126}
.prov.confirme{background:rgba(181,98,62,.1);color:#8a4a30}

/* ===== Forms ===== */
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.fld{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--mono);margin-bottom:5px;font-weight:500}
label.fld .req{color:var(--terra)}
label.fld .opt{color:var(--muted);opacity:.6;font-weight:400}
label.fld .cond{color:var(--warn);font-weight:400}
input.fld,select.fld,textarea.fld{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;font-size:13px;color:var(--ink);transition:border .15s;outline:none}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.12)}
input.fld.invalid{border-color:var(--err);background:rgba(169,56,41,.03)}
input.fld.mono,select.fld.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:5px;font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--anthracite);color:#fff}
.btn-primary:hover{background:#2d3640}
.btn-gold{background:var(--gold);color:var(--anthracite)}
.btn-gold:hover{background:#d4b05a}
.btn-outline{border:1px solid var(--line2);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-terra{background:var(--terra);color:#fff}
.btn-terra:hover{background:#c4714f}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-ghost{color:var(--muted);font-size:11px;padding:4px 8px;cursor:pointer}
.btn-ghost:hover{color:var(--ink)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(30,36,43,.4);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:820px;width:100%;margin:0 auto}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;color:var(--anthracite)}
.modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close:hover{background:var(--gris);color:var(--ink)}

/* ===== Flow steps ===== */
.flow-steps{display:flex;gap:0;margin-bottom:20px;flex-wrap:wrap}
.flow-step{flex:1;min-width:120px;position:relative;padding:10px 12px;border-top:2px solid var(--line);font-size:11px;transition:all .2s}
.flow-step .step-n{font-size:9px;font-family:var(--mono);color:var(--muted)}
.flow-step .step-t{font-weight:600;margin-top:2px;color:var(--ink)}
.flow-step.active{border-top-color:var(--gold);background:rgba(199,162,72,.04)}
.flow-step.done{border-top-color:var(--ok)}
.flow-step.done .step-n{color:var(--ok)}
.flow-step.done .step-t{color:var(--ok)}
.flow-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;min-height:300px}
.flow-step-title{font-size:16px;font-weight:600;margin-bottom:4px}
.flow-step-desc{font-size:12px;color:var(--muted);margin-bottom:16px}
.flow-field{display:grid;grid-template-columns:180px 1fr 90px 80px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.flow-field:last-child{border-bottom:none}
.flow-field .ff-label{font-weight:500}
.flow-field .ff-val{font-family:var(--mono);font-size:11px}
.conf-bar{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono)}
.conf-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conf-hi{background:var(--ok)}
.conf-md{background:var(--warn)}
.conf-lo{background:var(--err)}

/* ===== Alerts ===== */
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-sm);border:1px solid;font-size:12px;margin-bottom:8px}
.alert.err{border-color:rgba(169,56,41,.2);background:rgba(169,56,41,.04)}
.alert.warn{border-color:rgba(184,134,47,.2);background:rgba(184,134,47,.04)}
.alert.ok{border-color:rgba(45,125,70,.2);background:rgba(45,125,70,.04)}
.alert .ai{flex-shrink:0;width:20px;text-align:center;font-size:14px}
.alert .at{font-weight:600;margin-bottom:2px}
.alert .ad{color:var(--muted);font-size:11px;font-family:var(--mono)}

/* ===== Misc ===== */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--anthracite);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.compliance-bar{height:6px;border-radius:3px;background:var(--gris);overflow:hidden;margin-top:4px}
.compliance-fill{height:100%;border-radius:3px;transition:width .5s}

/* ===== Ceres Prev specific ===== */
.prev-map{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.canton-cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;text-align:center;transition:all .15s;cursor:pointer}
.canton-cell:hover{border-color:var(--gold);background:rgba(199,162,72,.03)}
.canton-cell.selected{border-color:var(--gold);background:rgba(199,162,72,.06);box-shadow:0 0 0 2px rgba(199,162,72,.15)}
.canton-cell .cn{font-size:11px;font-weight:600;color:var(--anthracite)}
.canton-cell .cy{font-size:18px;font-family:var(--mono);font-weight:600;color:var(--gold);margin:4px 0}
.canton-cell .ci{font-size:10px;font-family:var(--mono);color:var(--muted)}
.feature-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feature-bar .fl{width:110px;font-size:11px;font-family:var(--mono);color:var(--muted)}
.feature-bar .fb{flex:1;height:8px;border-radius:4px;background:var(--gris);overflow:hidden}
.feature-bar .ff{height:100%;border-radius:4px}
.feature-bar .fv{width:42px;text-align:right;font-size:11px;font-family:var(--mono);font-weight:600}
.chart-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.chart-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite);margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:14px}
.legend{display:flex;gap:16px;font-size:11px;font-family:var(--mono);margin-bottom:10px}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:3px;border-radius:2px}
.pred-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:linear-gradient(135deg,rgba(199,162,72,.04),rgba(181,98,62,.02))}
.pred-big{font-size:32px;font-family:var(--mono);font-weight:600;color:var(--anthracite);letter-spacing:-0.02em}
.pred-unit{font-size:14px;color:var(--muted);font-weight:400}
.pred-ci{font-size:12px;font-family:var(--mono);color:var(--muted);margin-top:6px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric-cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;text-align:center}
.metric-cell .ml{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono)}
.metric-cell .mv{font-size:18px;font-family:var(--mono);font-weight:600;color:var(--anthracite);margin:4px 0}
.metric-cell .mh{font-size:10px;font-family:var(--mono);color:var(--muted)}
.parcelle-pred-row{display:grid;grid-template-columns:1fr 80px 90px 100px 80px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.parcelle-pred-row:hover{background:rgba(199,162,72,.03)}
.parcelle-pred-row.selected{background:rgba(199,162,72,.06)}
.parcelle-pred-row:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-name">Ceres</div>
        <div class="brand-sub">FarmCockpit · Reg.</div>
      </div>
    </div>
    <div class="nav-group-label">Modules reglementaires</div>
    <div class="nav">
      <button class="nav-item active" data-view="registre" onclick="navTo('registre')"><span class="ico">▦</span>Registre phyto<span class="nav-count" id="cnt-reg">0</span></button>
      <button class="nav-item" data-view="flux" onclick="navTo('flux')"><span class="ico">↻</span>Flux agentique</button>
      <button class="nav-item" data-view="declarations" onclick="navTo('declarations')"><span class="ico">≡</span>Declarations</button>

  </aside>

  <main class="main">

        <h1 id="page-title">Registre phyto</h1>
        <span class="topbar-role" id="role-pill">Reglementaire</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-meta" id="topbar-meta">SIRET 482 564 701 00018 · Cantal (15)</span>
        <button class="topbar-btn" onclick="exportJSON()">↓ JSON</button>
        <button class="topbar-btn" onclick="exportCSV()">↓ CSV</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
/* ============================================================
   CERES FARMCOCKPIT · MODULES REGLEMENTAIRES
   Arpent Lab · arrete 24/12/2025 Annexe I · Regl. UE 2023/564
   ============================================================ */

const SIRET_DETENTEUR = '48256470100018';
const SIRET_BENEF = '48256470100018';

// --- AMM reels (E-Phy ANSES) ---
const AMM_DB = {
  '9400352':  { produit:'MODDUS',    substance:'Spiroxamine 500g/L',           dose:0.8, unite:'L/ha',  horaire:true,  cultures:['TRZAX','HORVS','TRZDU'], delai:'48h' },
  '20080037': { produit:'BELL',      substance:'Prothioconazole + Tebuconazole', dose:0.6, unite:'L/ha',  horaire:true,  cultures:['TRZAX','TRZDU','HORVS'], delai:'21j' },

function conformite() {
  if (!REGISTRE.length) return 100;
  const checks = REGISTRE.map(r => {
    let ok = 0, total = 17;
    if (r.siretDetenteur && r.siretDetenteur.length===14) ok++;
    if (r.siretBeneficiaire) ok++;
    if (r.produit) ok++;
    if (r.amm && r.amm.length===7) ok++;
    if (r.dateUtilisation) ok++;
    if (r.horaireDebut) ok++; else if (!AMM_DB[r.amm]?.horaire) ok++;
    if (r.horaireFin) ok++; else if (!AMM_DB[r.amm]?.horaire) ok++;
    if (r.delaiRentree) ok++;
    if (r.dose && r.dose>0) ok++;
    if (r.cible || true) ok++;
    if (r.modeApplication || true) ok++;
    if (r.ilot && r.parcelle && r.insee) ok++;
    if (r.gps) ok++;
    if (r.surface && r.surface>0) ok++;
    if (r.culture) ok++;
    if (r.bbch) ok++;
    if (r.biologique) ok++;
    return ok / total;
  });
  return Math.round(checks.reduce((s,c)=>s+c,0) / checks.length * 100);
}

    ilot: p.ilot, parcelle: p.parcelle, insee: p.insee,

    bbch: document.getElementById('f-bbch').value,
    biologique: document.getElementById('f-bio').value,
    provenance: 'saisi', timestamp: nowISO(), version: 1, author: 'exploitant',
  };
  REGISTRE.push(entry);
  addTrace('REGISTRE', 'Ajout manuel: ' + d.produit + ' sur ' + p.ilot + '/' + p.parcelle);

  toast('Utilisation enregistree · ' + d.produit);

}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

/* ============================================================
   MODULE 2 : FLUX AGENTIQUE (7 etapes)
   ============================================================ */
function viewFlux() {
  return `
  <div class="flow-steps">
    <div class="flow-step ${flowStep===0?'active':''}" id="fs-0"><div class="step-n">01</div><div class="step-t">Extraction</div></div>
    <div class="flow-step" id="fs-1"><div class="step-n">02</div><div class="step-t">Reconciliation</div></div>
    <div class="flow-step" id="fs-2"><div class="step-n">03</div><div class="step-t">Controles</div></div>
    <div class="flow-step" id="fs-3"><div class="step-n">04</div><div class="step-t">Questions</div></div>
    <div class="flow-step" id="fs-4"><div class="step-n">05</div><div class="step-t">Validation</div></div>
    <div class="flow-step" id="fs-5"><div class="step-n">06</div><div class="step-t">Registre</div></div>
    <div class="flow-step" id="fs-6"><div class="step-n">07</div><div class="step-t">Exports</div></div>
  </div>
  <div class="flow-panel" id="flow-panel"></div>
  <div id="flow-controls" style="margin-top:14px;display:flex;justify-content:space-between"></div>
  `;
}

function initFlux() {
  flowStep = 0;
  flowData = null;
  renderFlowStep();
}

function updateFlowSteps() {
  for (let i = 0; i < 7; i++) {
    const el = document.getElementById('fs-' + i);
    if (!el) continue;
    el.classList.remove('active', 'done');
    if (i < flowStep) el.classList.add('done');
    else if (i === flowStep) el.classList.add('active');
  }
}

function renderFlowStep() {
  updateFlowSteps();
  const panel = document.getElementById('flow-panel');
  const controls = document.getElementById('flow-controls');
  const steps = [flowExtraction, flowReconciliation, flowControles, flowQuestions, flowValidation, flowRegistre, flowExports];
  steps[flowStep](panel, controls);
}

function flowExtraction(panel, controls) {
  if (!flowData) {
    flowData = {
      source: 'scan_ticket_2026-04-15.jpg',
      raw: {
        siretDetenteur:    { val: SIRET_DETENTEUR, conf: 0.99 },
        siretBeneficiaire: { val: '', conf: 0.0 },
        produit:           { val: 'MODDUS', conf: 0.92 },
        amm:               { val: '9400352', conf: 0.88 },
        dateUtilisation:   { val: '15/04/2026', conf: 0.75 },
        horaireDebut:      { val: '07:30', conf: 0.60 },
        horaireFin:        { val: '09:00', conf: 0.55 },
        delaiRentree:      { val: '48h', conf: 0.50 },
        dose:              { val: '0.8', conf: 0.85 },
        cible:             { val: '', conf: 0.0 },
        modeApplication:   { val: 'Pulverisation', conf: 0.70 },
        ilot:              { val: '1001', conf: 0.95 },
        parcelle:          { val: '3', conf: 0.95 },
        insee:             { val: '15001', conf: 0.90 },
        gps:               { val: '', conf: 0.0 },
        surface:           { val: '', conf: 0.0 },
        culture:           { val: 'TRZAX', conf: 0.80 },
        bbch:              { val: '', conf: 0.0 },
        biologique:         { val: 'non', conf: 0.95 },
      }
    };
  }
  const fields = flowData.raw;
  const rows = Object.entries(fields).map(([k,v]) => {
    const cls = v.conf >= 0.8 ? 'conf-hi' : v.conf >= 0.5 ? 'conf-md' : 'conf-lo';
    const pct = Math.round(v.conf * 100);
    return `<div class="flow-field">
      <div class="ff-label">${fieldLabel(k)}</div>
      <div class="ff-val">${v.val || '<span class="muted">-</span>'}</div>
      <div><span class="conf-bar"><span class="conf-dot ${cls}"></span> ${pct}%</span></div>
      <div>${v.val ? '<span class="prov extrait">extrait</span>' : '<span class="tag neu">manquant</span>'}</div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="flow-step-title">01 · Extraction</div>
    <div class="flow-step-desc">Source: <span class="mono">${flowData.source}</span> · extraction des champs bruts avec score de confiance par champ. Les champs sous le seuil (60%) seront demandes a l'exploitant a l'etape 4.</div>
    <div>${rows}</div>
  `;
  controls.innerHTML = `<div></div><button class="btn btn-gold" onclick="nextFlow()">Etape suivante -></button>`;
}

function flowReconciliation(panel, controls) {
  const r = flowData.raw;
  const amm = r.amm.val;
  const ammInfo = AMM_DB[amm];
  const ilot = r.ilot.val, parcelle = r.parcelle.val, insee = r.insee.val;
  const parcMatch = PARCELLES.find(p => p.ilot === ilot && p.parcelle === parcelle && p.insee === insee);

  panel.innerHTML = `
    <div class="flow-step-title">02 · Reconciliation</div>
    <div class="flow-step-desc">Correspondance vers les referentiels: E-Phy (AMM), RPG (parcelle), OEPP (culture).</div>
    <div class="card-body">
      <div class="form-row"><strong>Produit -> AMM (E-Phy ANSES)</strong><div class="hint">AMM ${amm} -> ${ammInfo ? ammInfo.produit + ' · ' + ammInfo.substance + ' · dose ref ' + ammInfo.dose + ' ' + ammInfo.unite : '<span class="tag err">non trouve</span>'}</div></div>
      <div class="form-row"><strong>Parcelle -> RPG</strong><div class="hint">ilot ${ilot} / parcelle ${parcelle} / INSEE ${insee} -> ${parcMatch ? 'OK · ' + parcMatch.nom + ' · ' + parcMatch.surface + 'ha · ' + parcMatch.commune : '<span class="tag err">non trouve dans RPG</span>'}</div></div>
      <div class="form-row"><strong>Culture -> OEPP</strong><div class="hint">${r.culture.val} -> ${OEPP[r.culture.val] || 'code inconnu'} ${ammInfo && ammInfo.cultures.includes(r.culture.val) ? '<span class="tag ok">autorise pour AMM</span>' : '<span class="tag warn">verifier compatibilite</span>'}</div></div>
    </div>
  `;
  if (parcMatch) { r.surface.val = parcMatch.surface; r.surface.conf = 0.99; r.gps.val = parcMatch.gps; r.gps.conf = 0.99; r.culture.val = parcMatch.culture; r.culture.conf = 0.95; }
  if (ammInfo) { r.dose.val = ammInfo.dose; r.dose.conf = 0.95; r.doseUnite = ammInfo.unite; r.delaiRentree.val = ammInfo.delai; r.delaiRentree.conf = 0.90; }
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()"><- Retour</button><button class="btn btn-gold" onclick="nextFlow()">Etape suivante -></button>`;
}

function flowControles(panel, controls) {
  const r = flowData.raw;
  const amm = r.amm.val;
  const ammInfo = AMM_DB[amm];
  const parc = PARCELLES.find(p => p.ilot === r.ilot.val && p.parcelle === r.parcelle.val && p.insee === r.insee.val);
  const dose = parseFloat(r.dose.val);
  const surface = parc ? parc.surface : 0;
  const qtyNeeded = dose * surface;
  const checks = [
    { label:'Dose x surface <= quantite disponible', ok:true, detail: dose + ' ' + ammInfo.unite + ' x ' + surface + ' ha = ' + qtyNeeded.toFixed(2) + ' ' + ammInfo.unite + ' (stock: 25 ' + ammInfo.unite + ')' },
    { label:'AMM valide a la date', ok:true, detail:'AMM ' + amm + ' actif au ' + r.dateUtilisation.val },
    { label:'Produit autorise pour culture', ok: ammInfo.cultures.includes(r.culture.val), detail: ammInfo.produit + ' autorise sur ' + (OEPP[r.culture.val]||r.culture.val) + ' ? ' + (ammInfo.cultures.includes(r.culture.val) ? 'OUI' : 'NON') },
    { label:'Parcelle RPG existe', ok: !!parc, detail: parc ? 'ilot ' + r.ilot.val + '/' + r.parcelle.val + ' trouve · ' + parc.nom : 'non trouve' },
    { label:'AMM exige horaire', ok: !ammInfo.horaire || (r.horaireDebut.val && r.horaireFin.val), detail: ammInfo.horaire ? 'Horaires requis et presents (' + r.horaireDebut.val + ' - ' + r.horaireFin.val + ')' : 'Non requis' },
  ];

  panel.innerHTML = `
    <div class="flow-step-title">03 · Controles reglementaires</div>
    <div class="flow-step-desc">Verification automatique: dose, validite AMM, autorisation culture, existence RPG.</div>
    <div>${checks.map(c => `<div class="alert ${c.ok?'ok':'err'}"><div class="ai">${c.ok?'OK':'X'}</div><div><div class="at">${c.label}</div><div class="ad">${c.detail}</div></div></div>`).join('')}</div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()"><- Retour</button><button class="btn btn-gold" onclick="nextFlow()">Etape suivante -></button>`;
}

function flowQuestions(panel, controls) {
  const r = flowData.raw;
  const needConfirm = Object.entries(r).filter(([k,v]) => v.conf < 0.6);

  panel.innerHTML = `
    <div class="flow-step-title">04 · Questions a l'exploitant</div>
    <div class="flow-step-desc">L'agent demande SEULEMENT les champs manquants ou sous le seuil de confiance (60%). Ne devine jamais.</div>
    <div class="alert warn"><div class="ai">?</div><div><div class="at">Champs a confirmer</div><div class="ad">${needConfirm.length} champ(s) sous le seuil de 60%</div></div></div>
    ${needConfirm.length ? needConfirm.map(([k,v]) => `<div class="form-row">
      <label class="fld">${fieldLabel(k)} ${v.val ? '<span class="opt">(conf ' + Math.round(v.conf*100) + '%)</span>' : '<span class="req">*</span>'}</label>
      <input class="fld mono" id="qf-${k}" value="${v.val||''}" placeholder="${fieldLabel(k)}">
    </div>`).join('') : '<div class="alert ok"><div class="ai">OK</div><div><div class="at">Tous les champs sont au-dessus du seuil</div></div></div>'}
    <div class="hint">L'agent ne complete jamais un champ qu'il ne peut pas deduire. Il demande.</div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()"><- Retour</button><button class="btn btn-gold" onclick="collectQuestions(); nextFlow();">Confirmer -></button>`;
}

function collectQuestions() {
  const r = flowData.raw;
  Object.keys(r).forEach(k => {
    const el = document.getElementById('qf-' + k);
    if (el && el.value) { r[k].val = el.value; r[k].conf = 1.0; r[k].confirmed = true; }
  });
}

function flowValidation(panel, controls) {
  const r = flowData.raw;
  const rows = Object.entries(r).map(([k,v]) => {
    const prov = v.confirmed ? 'confirme' : v.conf >= 0.8 ? 'extrait' : v.conf >= 0.5 ? 'deduit' : 'saisi';
    return `<div class="flow-field">
      <div class="ff-label">${fieldLabel(k)}</div>
      <div class="ff-val">${v.val || '<span class="muted">-</span>'}</div>
      <div><span class="conf-bar"><span class="conf-dot ${v.conf>=0.8?'conf-hi':v.conf>=0.5?'conf-md':'conf-lo'}"></span> ${Math.round(v.conf*100)}%</span></div>
      <div><span class="prov ${prov}">${prov}</span></div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="flow-step-title">05 · Validation exploitant</div>
    <div class="flow-step-desc">L'exploitant confirme chaque champ. Provenance: saisi / extrait / deduit / confirme.</div>
    <div>${rows}</div>
    <div class="alert ok"><div class="ai">OK</div><div><div class="at">Tous les champs obligatoires sont remplis</div><div class="ad">L'exploitant valide le registre</div></div></div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()"><- Retour</button><button class="btn btn-gold" onclick="nextFlow()">Valider et enregistrer -></button>`;
}

function flowRegistre(panel, controls) {
  const r = flowData.raw;
  const parc = PARCELLES.find(p => p.ilot === r.ilot.val && p.parcelle === r.parcelle.val);
  const ammInfo = AMM_DB[r.amm.val];
  if (!flowData.registered) {
    const entry = {
      id: uid(),
      siretDetenteur: r.siretDetenteur.val,
      siretBeneficiaire: r.siretBeneficiaire.val || SIRET_BENEF,
      produit: ammInfo.produit, amm: r.amm.val,
      dateUtilisation: r.dateUtilisation.val,
      horaireDebut: r.horaireDebut.val, horaireFin: r.horaireFin.val,
      delaiRentree: r.delaiRentree.val,
      dose: parseFloat(r.dose.val), doseUnite: ammInfo.unite,
      cible: r.cible.val, modeApplication: r.modeApplication.val,
      ilot: r.ilot.val, parcelle: r.parcelle.val, insee: r.insee.val,
      nomParcelle: parc ? parc.nom : '', commune: parc ? parc.commune : '',
      localisation: r.ilot.val + '/' + r.parcelle.val + '/' + r.insee.val,
      gps: parc ? parc.gps : r.gps.val,
      surface: parc ? parc.surface : parseFloat(r.surface.val),
      culture: r.culture.val, bbch: r.bbch.val, biologique: r.biologique.val,
      provenance: 'confirme', timestamp: nowISO(), version: 1, author: 'agent-ceres',
    };
    REGISTRE.push(entry);
    flowData.registered = true;
    flowData.entryId = entry.id;
    addTrace('REGISTRE', 'Flux agentique: ' + ammInfo.produit + ' sur ' + r.ilot.val + '/' + r.parcelle.val + ' (v' + entry.version + ')');
    updateRegCount();
  }

  panel.innerHTML = `
    <div class="flow-step-title">06 · Registre immuable</div>
    <div class="flow-step-desc">Evenement versionne horodate. Toute correction = nouvelle version. Conservation 5 ans.</div>
    <div class="card-body">
      <div class="form-row"><strong>ID: <span class="mono">${flowData.entryId}</span></strong></div>
      <div class="form-row"><strong>Version:</strong> 1 · <strong>Auteur:</strong> agent-ceres · <strong>Timestamp:</strong> <span class="mono">${nowISO()}</span></div>
      <div class="form-row"><strong>Provenance:</strong> <span class="prov confirme">confirme</span> (tous champs)</div>
      <div class="divider"></div>
      <table class="tbl"><tbody>
        <tr><td>Produit</td><td>${ammInfo.produit} (AMM ${r.amm.val})</td></tr>
        <tr><td>Dose</td><td class="mono">${r.dose.val} ${ammInfo.unite}</td></tr>
        <tr><td>Parcelle</td><td class="mono">${r.ilot.val}/${r.parcelle.val} ${parc?parc.nom:''}</td></tr>
        <tr><td>Surface</td><td class="mono">${parc?parc.surface:''} ha</td></tr>
        <tr><td>Date</td><td class="mono">${r.dateUtilisation.val}</td></tr>
        <tr><td>Culture / BBCH</td><td class="mono">${r.culture.val} / ${r.bbch.val}</td></tr>
      </tbody></table>
    </div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()"><- Retour</button><button class="btn btn-gold" onclick="nextFlow()">Exporter -></button>`;
}

function flowExports(panel, controls) {
  panel.innerHTML = `
    <div class="flow-step-title">07 · Exports</div>
    <div class="flow-step-desc">CSV (UTF-8 BOM, une ligne par utilisation, 17 colonnes), JSON (schema_version 1.0.0), PDF (en-tete SIRET + periode).</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
      <button class="btn btn-gold" onclick="exportCSV()">↓ Export CSV (17 colonnes, UTF-8 BOM)</button>
      <button class="btn btn-gold" onclick="exportJSON()">↓ Export JSON (schema_version)</button>
      <button class="btn btn-gold" onclick="exportPDF()">↓ Export PDF (en-tete SIRET)</button>
    </div>
    <div class="divider"></div>
    <div class="section-title">Apercu CSV (5 premieres lignes)</div>
    <pre class="mono" style="font-size:10px;background:var(--anthracite);color:#c8cdd3;padding:14px;border-radius:var(--r);overflow-x:auto;max-height:300px;white-space:pre-wrap">${csvPreview()}</pre>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()"><- Retour</button><button class="btn btn-outline" onclick="initFlux()">Recommencer</button><button class="btn btn-gold" onclick="navTo('registre')">Voir registre -></button>`;
}

function nextFlow() { if (flowStep < 6) { flowStep++; renderFlowStep(); } }
function prevFlow() { if (flowStep > 0) { flowStep--; renderFlowStep(); } }

function fieldLabel(k) {
  const map = {
    siretDetenteur:'SIRET detenteur', siretBeneficiaire:'SIRET beneficiaire',
    produit:'Produit', amm:'AMM', dateUtilisation:'Date', horaireDebut:'H. debut', horaireFin:'H. fin',
    delaiRentree:'Delai rentree', dose:'Dose', cible:'Cible', modeApplication:'Mode application',
    ilot:'Ilot', parcelle:'Parcelle', insee:'INSEE', gps:'GPS', surface:'Surface', culture:'Culture', bbch:'BBCH', biologique:'Bio',
  };
  return map[k] || k;
}

      action: 'navTo(\'prev\')',
      color: 'ok',
    },
    {
      nom:'Registre phyto (Annexe I)',
      desc:'arrete 24/12/2025 · conservation 5 ans · 17 champs par utilisation',
      statut:'en cours', echeance:'31/01/2028',
      detail: `${REGISTRE.length} utilisations · conformite ${conf}% · conversion 2027`,
      action: 'navTo(\'registre\')',

    },
    {
      nom:'Traceabilite (CE 178/2002)',

      color: 'ok',
    },
    {
      nom:'Assurance recolte',
      desc:'Declaration surfaces + rendements historiques · assurance agricole',
      statut:'non demarree', echeance:'hiver 2026',
      detail: `${PARCELLES.length} parcelles a declarer · rendements 2020-2025 requis`,
      action: 'toast(\'Module assurance: bientot disponible\')',
      color: 'err',
    },
  ];

  const statutBadge = (s) => {
    if (s === 'a jour' || s === 'pre-remplie') return 'ok';
    if (s === 'en cours') return 'warn';
    if (s === 'en retard') return 'err';
    return 'neu';
  };

  return `
  <div class="grid-4" style="margin-bottom:18px">
    <div class="kpi accent"><div class="kpi-label">Declarations</div><div class="kpi-val">${decls.length}</div><div class="kpi-delta neu">toutes obligations</div></div>
    <div class="kpi ok"><div class="kpi-label">A jour</div><div class="kpi-val">${decls.filter(d=>d.statut==='a jour'||d.statut==='pre-remplie').length}</div><div class="kpi-delta pos">conformes</div></div>
    <div class="kpi"><div class="kpi-label">En cours</div><div class="kpi-val">${decls.filter(d=>d.statut==='en cours').length}</div><div class="kpi-delta neu">a finaliser</div></div>
    <div class="kpi terra"><div class="kpi-label">Non demarrees</div><div class="kpi-val">${decls.filter(d=>d.statut==='non demarree').length}</div><div class="kpi-delta neg">action requise</div></div>
  </div>

  <div class="section-title">Tableau de bord declarations consolidees</div>
  <div class="grid-2" style="margin-bottom:16px">
    ${decls.map(d => `
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">${d.nom}</div><div class="card-sub">${d.desc}</div></div>
        <span class="tag ${statutBadge(d.statut)}">${d.statut}</span>
      </div>
      <div class="card-body">

function autoFill(name) {

function pacConformite() {
  let ok = 0, total = 0;
  PARCELLES.forEach(p => {
    const checks = [p.surface >= 5, p.culture !== 'BRAAN' || p.surface < 20, true, p.ilot !== '9999'];
    checks.forEach(c => { total++; if (c) ok++; });
  });
  return Math.round((ok / total) * 100);
}

function renderPrevChart() {
  const w = 720, h = 240, pad = { l: 50, r: 20, t: 20, b: 40 };
  const xs = RETRO.map((_, i) => pad.l + (i / (RETRO.length - 1)) * (w - pad.l - pad.r));
  const allVals = RETRO.flatMap(r => [r.pred, r.actuel, 61.2]);
  const yMin = Math.min(...allVals) - 3;
  const yMax = Math.max(...allVals) + 3;
  const yScale = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);

  const predPts = RETRO.map((r, i) => `${xs[i]},${yScale(r.pred)}`).join(' ');
  const actPts = RETRO.map((r, i) => `${xs[i]},${yScale(r.actuel)}`).join(' ');
  const avgY = yScale(61.2);

  const gridLines = [];
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (i / 4) * (yMax - yMin);
    gridLines.push(`<line x1="${pad.l}" y1="${yScale(v)}" x2="${w - pad.r}" y2="${yScale(v)}" stroke="var(--gris)" stroke-width="1"/>`);
    gridLines.push(`<text x="${pad.l - 8}" y="${yScale(v) + 4}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">${v.toFixed(0)}</text>`);
  }
  const xLabels = RETRO.map((r, i) => `<text x="${xs[i]}" y="${h - pad.b + 16}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${r.annee}</text>`);

  const predDots = RETRO.map((r, i) => `<circle cx="${xs[i]}" cy="${yScale(r.pred)}" r="4" fill="var(--gold)"/>`);
  const actDots = RETRO.map((r, i) => `<circle cx="${xs[i]}" cy="${yScale(r.actuel)}" r="4" fill="var(--terra)"/>`);

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${gridLines.join('')}
    <line x1="${pad.l}" y1="${avgY}" x2="${w - pad.r}" y2="${avgY}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="${w - pad.r}" y="${avgY - 6}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">moy. 61.2</text>
    <polyline points="${predPts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
    <polyline points="${actPts}" fill="none" stroke="var(--terra)" stroke-width="2"/>
    ${predDots.join('')}
    ${actDots.join('')}
    ${xLabels.join('')}
  </svg>`;
}

function selectCanton(i) {

  toast('Canton selectionne: ' + CANTONS[i].nom + ' · ' + CANTONS[i].bleTendre.toFixed(1) + ' q/ha');

const CSV_HEADERS = [
  'siret_detenteur','siret_beneficiaire','produit','amm','date_utilisation',
  'horaire_debut','horaire_fin','delai_rentree_anticipee','dose','dose_unite',
  'cible','mode_application','ilot_rpg','parcelle_rpg','commune_insee',
  'gps_wgs84','surface_traitee_ha','culture_oepp','stade_bbch','conduite_biologique',
  'provenance','timestamp','version','author'
];

function buildCSV() {
  const rows = [CSV_HEADERS];
  REGISTRE.forEach(r => {
    rows.push([
      r.siretDetenteur, r.siretBeneficiaire, r.produit, r.amm, r.dateUtilisation,
      r.horaireDebut, r.horaireFin, r.delaiRentree, r.dose, r.doseUnite,
      r.cible, r.modeApplication, r.ilot, r.parcelle, r.insee,
      r.gps, r.surface, r.culture, r.bbch, r.biologique,
      r.provenance, r.timestamp, r.version, r.author
    ]);
  });
  return '\ufeff' + rows.map(row => row.map(c => {
    const s = String(c == null ? '' : c);
    return s.includes(';') || s.includes('"') ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}

function exportCSV() {
  if (REGISTRE.length === 0) { toast('Registre vide · rien a exporter'); return; }
  const csv = buildCSV();
  downloadFile('ceres_registre_phyto.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV exporte · ' + REGISTRE.length + ' ligne(s) · 17 colonnes · UTF-8 BOM');
  addTrace('EXPORT', 'CSV · ' + REGISTRE.length + ' lignes · UTF-8 BOM · delimiteur ;');
}

function csvPreview() {
  if (!REGISTRE.length) return 'Registre vide';
  const lines = buildCSV().split('\r\n').slice(0, 6);
  return lines.map(l => l.substring(0, 140) + (l.length > 140 ? '...' : '')).join('\n');
}

function exportPDF() {
  const header = 'CERES · REGISTRE PHYTO · SIRET ' + SIRET_DETENTEUR + ' · Periode 2026 · Genere le ' + todayFR();
  const sep = '-'.repeat(80);
  const rows = REGISTRE.map(r =>
    r.dateUtilisation + ' | ' + r.produit.padEnd(12) + ' | AMM ' + r.amm + ' | ' +
    r.ilot + '/' + r.parcelle + ' | ' + r.surface + 'ha | ' + r.culture + ' | BBCH ' + r.bbch + ' | ' + r.provenance
  );
  const content = [header, sep, 'Date        | Produit      | AMM       | Parcelle  | Surface | Culture | BBCH | Prov.', sep, ...rows, sep, 'Total: ' + REGISTRE.length + ' utilisations · conformite ' + conformite() + '%', 'Conservation 5 ans · arrete 24/12/2025 Annexe I · Regl. UE 2023/564'].join('\n');
  downloadFile('ceres_registre_phyto.txt', content, 'text/plain;charset=utf-8');
  toast('PDF exporte (txt) · en-tete SIRET');
  addTrace('EXPORT', 'PDF (txt) · en-tete SIRET ' + SIRET_DETENTEUR);
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
