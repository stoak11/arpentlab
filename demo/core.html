<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmCockpit · Core · Arpent Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --anthracite:#1e242b; --gold:#c7a248; --terra:#b5623e; --paper:#fafaf8;
  --gris:#eaece8; --gris2:#d4d7d2; --ink:#2a2f36; --muted:#6b7280;
  --line:#e2e5e0; --line2:#cfd3cc; --ok:#2d7d46; --warn:#b8862f; --err:#a93829;
  --r:8px; --r-sm:5px; --r-lg:14px;
  --shadow:0 1px 3px rgba(30,36,43,.06),0 1px 2px rgba(30,36,43,.04);
  --shadow-md:0 4px 12px rgba(30,36,43,.08),0 2px 4px rgba(30,36,43,.04);
  --shadow-lg:0 12px 32px rgba(30,36,43,.12),0 4px 8px rgba(30,36,43,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:inherit;text-decoration:none}
::selection{background:rgba(199,162,72,.25)}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--anthracite);color:#c8cdd3;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.brand{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--gold),var(--terra));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--anthracite);font-family:var(--mono)}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.brand-sub{font-size:9px;color:rgba(255,255,255,.4);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.role-section{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.role-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);font-family:var(--mono);margin-bottom:8px;display:block}
.role-tabs{display:flex;flex-direction:column;gap:3px}
.role-tab{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);font-size:12px;color:rgba(255,255,255,.6);transition:all .15s;text-align:left;font-weight:500}
.role-tab:hover{background:rgba(255,255,255,.06);color:#fff}
.role-tab.active{background:rgba(199,162,72,.14);color:var(--gold)}
.role-tab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.role-tab[data-role="exploitant"] .dot{background:var(--gold)}
.role-tab[data-role="coop"] .dot{background:var(--terra)}
.role-tab[data-role="agent"] .dot{background:#6b9bd8}
.nav-group-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);font-family:var(--mono);padding:14px 14px 7px;display:block}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;color:rgba(255,255,255,.55);transition:all .12s;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.nav-item .ico{width:15px;height:15px;flex-shrink:0;opacity:.7;text-align:center;font-size:13px}
.nav-count{margin-left:auto;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}
.sidebar-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:rgba(255,255,255,.3);font-family:var(--mono);line-height:1.6}
.sidebar-foot a{color:var(--gold);opacity:.7}
.sidebar-foot a:hover{opacity:1}

.main{overflow-y:auto;background:var(--paper)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--gris2);border-radius:3px}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.topbar-breadcrumb{font-size:11px;color:var(--muted);font-family:var(--mono);display:flex;gap:6px;align-items:center}
.topbar-breadcrumb .sep{opacity:.4}
.topbar-role{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:14px}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);color:var(--ok);text-transform:uppercase;letter-spacing:.04em}
.live-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-meta{font-size:11px;font-family:var(--mono);color:var(--muted)}
.topbar-btn{font-size:11px;font-family:var(--mono);color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:5px;transition:all .15s;text-transform:uppercase;letter-spacing:.04em}
.topbar-btn:hover{border-color:var(--gold);color:var(--ink)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--anthracite);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:var(--mono)}
.content{padding:24px;max-width:1100px;margin:0 auto}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite)}
.card-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card-body{padding:18px}
.card-body.tight{padding:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ===== KPI ===== */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono)}
.kpi-val{font-size:26px;font-weight:600;font-family:var(--mono);margin:6px 0 2px;letter-spacing:-0.02em;color:var(--anthracite)}
.kpi-unit{font-size:13px;color:var(--muted);font-weight:400}
.kpi-delta{font-size:11px;font-family:var(--mono);margin-top:4px}
.kpi-delta.pos{color:var(--ok)} .kpi-delta.neg{color:var(--err)} .kpi-delta.neu{color:var(--muted)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r);background:var(--gris2)}
.kpi.accent::before{background:var(--gold)}
.kpi.terra::before{background:var(--terra)}
.kpi.ok::before{background:var(--ok)}
.kpi.warn::before{background:var(--warn)}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .arr{font-size:9px;opacity:.4;margin-left:3px}
.tbl th.sorted .arr{opacity:1;color:var(--gold)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(199,162,72,.03)}
.tbl td .mono{font-family:var(--mono);font-size:11px}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl-wrap{overflow-x:auto}
.row-clickable{cursor:pointer}

/* ===== Tags & badges ===== */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.gold{background:rgba(199,162,72,.12);color:#8a7126;border:1px solid rgba(199,162,72,.2)}
.tag.terra{background:rgba(181,98,62,.1);color:#8a4a30;border:1px solid rgba(181,98,62,.2)}
.tag.ok{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.tag.warn{background:rgba(184,134,47,.1);color:var(--warn);border:1px solid rgba(184,134,47,.2)}
.tag.err{background:rgba(169,56,41,.08);color:var(--err);border:1px solid rgba(169,56,41,.15)}
.tag.neu{background:var(--gris);color:var(--muted);border:1px solid var(--line)}
.tag.info{background:rgba(107,155,216,.08);color:#4a7cb8;border:1px solid rgba(107,155,216,.15)}
.prov{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;font-weight:600}
.prov.saisi{background:rgba(45,125,70,.1);color:var(--ok)}
.prov.extrait{background:rgba(107,155,216,.1);color:#4a7cb8}
.prov.deduit{background:rgba(199,162,72,.12);color:#8a7126}
.prov.confirme{background:rgba(181,98,62,.1);color:#8a4a30}

/* ===== Forms ===== */
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.fld{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--mono);margin-bottom:5px;font-weight:500}
label.fld .req{color:var(--terra)}
label.fld .opt{color:var(--muted);opacity:.6;font-weight:400}
input.fld,select.fld,textarea.fld{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;font-size:13px;color:var(--ink);transition:border .15s;outline:none}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.12)}
input.fld.mono,select.fld.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:5px;font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--anthracite);color:#fff}
.btn-primary:hover{background:#2d3640}
.btn-gold{background:var(--gold);color:var(--anthracite)}
.btn-gold:hover{background:#d4b05a}
.btn-outline{border:1px solid var(--line2);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-terra{background:var(--terra);color:#fff}
.btn-terra:hover{background:#c4714f}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-ghost{color:var(--muted);font-size:11px;padding:4px 8px}
.btn-ghost:hover{color:var(--ink)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(30,36,43,.4);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:780px;width:100%;margin:0 auto}
.modal.lg{max-width:920px}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;color:var(--anthracite)}
.modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--gris);color:var(--ink)}

/* ===== Alerts ===== */
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-sm);border:1px solid;font-size:12px;margin-bottom:8px}
.alert.err{border-color:rgba(169,56,41,.2);background:rgba(169,56,41,.04)}
.alert.warn{border-color:rgba(184,134,47,.2);background:rgba(184,134,47,.04)}
.alert.ok{border-color:rgba(45,125,70,.2);background:rgba(45,125,70,.04)}
.alert.info{border-color:rgba(107,155,216,.2);background:rgba(107,155,216,.04)}
.alert .ai{flex-shrink:0;width:20px;text-align:center;font-size:14px}
.alert .at{font-weight:600;margin-bottom:2px}
.alert .ad{color:var(--muted);font-size:11px;font-family:var(--mono)}
.alert-clickable{cursor:pointer;transition:all .15s}
.alert-clickable:hover{box-shadow:var(--shadow)}

/* ===== Misc ===== */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono);margin-bottom:10px;margin-top:6px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
.compliance-bar{height:6px;border-radius:3px;background:var(--gris);overflow:hidden;margin-top:4px}
.compliance-fill{height:100%;border-radius:3px;transition:width .5s}

/* ===== Toast ===== */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--anthracite);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.toast.ok .dot{background:var(--ok)}
.toast.err .dot{background:var(--err)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== Detail grid (modal) ===== */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.detail-grid .dg-row{display:contents}
.detail-grid .dg-label,.detail-grid .dg-val{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px}
.detail-grid .dg-label{background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:500;border-right:1px solid var(--line)}
.detail-grid .dg-val{font-family:var(--mono);font-size:11px}

/* ===== Connexion cards ===== */
.conn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.conn-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;transition:box-shadow .15s}
.conn-card:hover{box-shadow:var(--shadow-md)}
.conn-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.conn-name{font-size:13px;font-weight:600;color:var(--anthracite)}
.conn-type{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.conn-status{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:10px}
.conn-status.connecte{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.conn-status.preparation{background:rgba(184,134,47,.08);color:var(--warn);border:1px solid rgba(184,134,47,.15)}
.conn-status .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.conn-fields{font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.6;margin-top:8px}
.conn-meta{display:flex;gap:12px;margin-top:10px;font-size:10px;font-family:var(--mono);color:var(--muted);flex-wrap:wrap}
.conn-meta span{white-space:nowrap}

/* ===== Stock movement log ===== */
.movement{display:grid;grid-template-columns:120px 60px 1fr 80px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
.movement:last-child{border-bottom:none}
.movement .mv-date{font-family:var(--mono);font-size:10px;color:var(--muted)}
.movement .mv-type{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:3px}
.movement .mv-type.entree{background:rgba(45,125,70,.1);color:var(--ok)}
.movement .mv-type.sortie{background:rgba(181,98,62,.1);color:#8a4a30}
.movement .mv-desc{font-size:11px}
.movement .mv-qty{font-family:var(--mono);text-align:right;font-size:11px}

/* ===== Quick links ===== */
.quick-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.quick-link{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.quick-link:hover{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.08)}
.quick-link .ql-ico{font-size:18px;opacity:.6}
.quick-link .ql-label{font-size:12px;font-weight:500}
.quick-link .ql-sub{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ===== Profil ===== */
.info-row{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.info-row:last-child{border-bottom:none}
.info-row .ir-label{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.info-row .ir-val{font-size:13px}
.info-row .ir-val .mono{font-family:var(--mono);font-size:12px}

/* ===== Responsive ===== */
@media(max-width:840px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .conn-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .detail-grid .dg-label{border-right:none;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div>
        <div class="brand-name">FarmCockpit</div>
        <div class="brand-sub">Arpent Lab · Ceres</div>
      </div>
    </div>
    <div class="role-section">
      <span class="role-label">Role</span>
      <div class="role-tabs">
        <button class="role-tab active" data-role="exploitant" onclick="App.setRole('exploitant')"><span class="dot"></span>Exploitant</button>
        <button class="role-tab" data-role="coop" onclick="App.setRole('coop')"><span class="dot"></span>Coopérative</button>
        <button class="role-tab" data-role="agent" onclick="App.setRole('agent')"><span class="dot"></span>Agent</button>
      </div>
    </div>
    <div id="navContainer"></div>
    <div class="sidebar-foot">
      Arpent Lab · FarmCockpit<br>arrete 24/12/2025 · Annexe I<br><a href="https://arpent.ai">arpent.ai</a> · IA Act art 50(1)
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">Tableau de bord</h1>
        <span class="topbar-breadcrumb" id="topbarBreadcrumb"></span>
        <span class="topbar-role" id="rolePill">Exploitant</span>
      </div>
      <div class="topbar-right">
        <span class="live-badge"><span class="pulse"></span>Sync OK</span>
        <span class="topbar-meta" id="topbarMeta"></span>
        <button class="topbar-btn" onclick="App.exportData()">Export</button>
        <div class="user-avatar">FD</div>

    // Update nav active
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === this.state.view));

    // Render content
    const c = document.getElementById('content');
    const viewFn = this.views[this.state.view];
    if (viewFn) {
      c.innerHTML = viewFn.call(this);
      // Run onMount if provided
      if (this._onMount) { this._onMount(); this._onMount = null; }
    } else {
      c.innerHTML = '<div class="empty">Module non disponible: ' + this.state.view + '</div>';

    // Update page title
    const title = TITLES[this.state.view] || this.state.view;
    document.getElementById('pageTitle').textContent = title;
    const bc = document.getElementById('topbarBreadcrumb');
    if (bc) bc.innerHTML = '<span class="sep">/</span>' + (this.state.role === 'exploitant' ? 'Exploitation' : this.state.role === 'coop' ? 'Cooperative' : 'Agent') + '<span class="sep">/</span>' + title;

    const container = document.getElementById('navContainer');

    html += '<div class="nav">';
    items.forEach(item => {
      const count = item.count ? item.count() : '';
      const countHtml = count !== '' ? '<span class="nav-count">' + count + '</span>' : '';
      html += '<button class="nav-item' + (this.state.view === item.id ? ' active' : '') + '" data-view="' + item.id + '" onclick="App.navigateTo(\'' + item.id + '\')"><span class="ico">' + item.ico + '</span>' + item.label + countHtml + '</button>';

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  },

  exportData() {
    const json = JSON.stringify({ app:'FarmCockpit', version:'1.0', generated: new Date().toISOString(), data: DATA }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'farmcockpit_export.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.toast('Export JSON telecharge');

App.sortTable = function(col) {
  // Simple sort toggle
  if (App.state.sortCol === col) {
    App.state.sortDir = App.state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    App.state.sortCol = col;
    App.state.sortDir = 'asc';
  }
  DATA.parcels.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'number') return App.state.sortDir === 'asc' ? va - vb : vb - va;
    va = String(va); vb = String(vb);
    return App.state.sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  App.render();
  App.toast('Tri par ' + col + ' (' + App.state.sortDir + ')');
};

    '<div class="dg-label">Type</div><div class="dg-val">' + c.type + '</div>' +
    '<div class="dg-label">Statut</div><div class="dg-val"><span class="tag ' + (c.status === 'connecte' ? 'ok' : 'warn') + '">' + c.status + '</span></div>' +
    '<div class="dg-label">Derniere sync</div><div class="dg-val">' + c.derniereSync + '</div>' +
    '<div class="dg-label">Version</div><div class="dg-val">' + c.version + '</div>' +
    '<div class="dg-label">Description</div><div class="dg-val">' + c.desc + '</div>' +
    '<div class="dg-label">Champs disponibles</div><div class="dg-val">' + c.champs + '</div>' +
    '</div>';
  App.openModal('Detail connexion: ' + c.nom, body);
};

/* ----- ADHERENTS (Coop role) ----- */
App.registerView('adherents', function() {
  return '<div class="card"><div class="card-head"><div><div class="card-title">Adherents</div><div class="card-sub">Cantal Cereales · ' + DATA.adherents.length + ' exploitations</div></div></div><div class="card-body tight">' +
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>SIRET</th><th>Nom</th><th class="num">Parcelles</th><th class="num">Surface</th><th class="num">Utilisations</th><th class="num">Conformite</th></tr></thead><tbody>' +
  DATA.adherents.map(a => '<tr><td class="mono">' + a.siret + '</td><td>' + a.nom + '</td><td class="num">' + a.parcelles + '</td><td class="num">' + a.surface.toFixed(1) + ' ha</td><td class="num">' + a.utilisations + '</td><td class="num"><span class="tag ' + (a.conformite >= 95 ? 'ok' : a.conformite >= 90 ? 'warn' : 'err') + '">' + a.conformite + '%</span></td></tr>').join('') +
  '</tbody></table></div></div></div>';
});

/* ===== INIT ===== */
App.init();
</script>
</body>
</html>
