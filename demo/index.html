<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmCockpit - Ceres | Arpent Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --anthracite:#1e242b; --gold:#c7a248; --terra:#b5623e; --paper:#fafaf8;
  --gris:#eaece8; --gris2:#d4d7d2; --ink:#2a2f36; --muted:#6b7280;
  --line:#e2e5e0; --line2:#cfd3cc; --ok:#2d7d46; --warn:#b8862f; --err:#a93829;
  --r:8px; --r-sm:5px; --r-lg:14px;
  --shadow:0 1px 3px rgba(30,36,43,.06),0 1px 2px rgba(30,36,43,.04);
  --shadow-md:0 4px 12px rgba(30,36,43,.08),0 2px 4px rgba(30,36,43,.04);
  --shadow-lg:0 12px 32px rgba(30,36,43,.12),0 4px 8px rgba(30,36,43,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:inherit;text-decoration:none}
::selection{background:rgba(199,162,72,.25)}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--anthracite);color:#c8cdd3;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.brand{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--gold),var(--terra));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--anthracite);font-family:var(--mono)}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.brand-sub{font-size:9px;color:rgba(255,255,255,.4);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.role-section{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.role-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);font-family:var(--mono);margin-bottom:8px;display:block}
.role-tabs{display:flex;flex-direction:column;gap:3px}
.role-tab{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);font-size:12px;color:rgba(255,255,255,.6);transition:all .15s;text-align:left;font-weight:500}
.role-tab:hover{background:rgba(255,255,255,.06);color:#fff}
.role-tab.active{background:rgba(199,162,72,.14);color:var(--gold)}
.role-tab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.role-tab[data-role="exploitant"] .dot{background:var(--gold)}
.role-tab[data-role="coop"] .dot{background:var(--terra)}
.role-tab[data-role="agent"] .dot{background:#6b9bd8}
.nav-group-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);font-family:var(--mono);padding:14px 14px 7px;display:block}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;color:rgba(255,255,255,.55);transition:all .12s;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.nav-item .ico{width:15px;height:15px;flex-shrink:0;opacity:.7;text-align:center;font-size:13px}
.nav-count{margin-left:auto;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}
.sidebar-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:rgba(255,255,255,.3);font-family:var(--mono);line-height:1.6}
.sidebar-foot a{color:var(--gold);opacity:.7}
.sidebar-foot a:hover{opacity:1}

.main{overflow-y:auto;background:var(--paper)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--gris2);border-radius:3px}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.topbar-breadcrumb{font-size:11px;color:var(--muted);font-family:var(--mono);display:flex;gap:6px;align-items:center}
.topbar-breadcrumb .sep{opacity:.4}
.topbar-role{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:14px}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-family:var(--mono);color:var(--ok);text-transform:uppercase;letter-spacing:.04em}
.live-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-meta{font-size:11px;font-family:var(--mono);color:var(--muted)}
.topbar-btn{font-size:11px;font-family:var(--mono);color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:5px;transition:all .15s;text-transform:uppercase;letter-spacing:.04em}
.topbar-btn:hover{border-color:var(--gold);color:var(--ink)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--anthracite);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-family:var(--mono)}
.content{padding:24px;max-width:1100px;margin:0 auto}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite)}
.card-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card-body{padding:18px}
.card-body.tight{padding:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ===== KPI ===== */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono)}
.kpi-val{font-size:26px;font-weight:600;font-family:var(--mono);margin:6px 0 2px;letter-spacing:-0.02em;color:var(--anthracite)}
.kpi-unit{font-size:13px;color:var(--muted);font-weight:400}
.kpi-delta{font-size:11px;font-family:var(--mono);margin-top:4px}
.kpi-delta.pos{color:var(--ok)} .kpi-delta.neg{color:var(--err)} .kpi-delta.neu{color:var(--muted)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r);background:var(--gris2)}
.kpi.accent::before{background:var(--gold)}
.kpi.terra::before{background:var(--terra)}
.kpi.ok::before{background:var(--ok)}
.kpi.warn::before{background:var(--warn)}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink)}
.tbl th .arr{font-size:9px;opacity:.4;margin-left:3px}
.tbl th.sorted .arr{opacity:1;color:var(--gold)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(199,162,72,.03)}
.tbl td .mono{font-family:var(--mono);font-size:11px}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl-wrap{overflow-x:auto}
.row-clickable{cursor:pointer}

/* ===== Tags & badges ===== */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.gold{background:rgba(199,162,72,.12);color:#8a7126;border:1px solid rgba(199,162,72,.2)}
.tag.terra{background:rgba(181,98,62,.1);color:#8a4a30;border:1px solid rgba(181,98,62,.2)}
.tag.ok{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.tag.warn{background:rgba(184,134,47,.1);color:var(--warn);border:1px solid rgba(184,134,47,.2)}
.tag.err{background:rgba(169,56,41,.08);color:var(--err);border:1px solid rgba(169,56,41,.15)}
.tag.neu{background:var(--gris);color:var(--muted);border:1px solid var(--line)}
.tag.info{background:rgba(107,155,216,.08);color:#4a7cb8;border:1px solid rgba(107,155,216,.15)}
.prov{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;font-weight:600}
.prov.saisi{background:rgba(45,125,70,.1);color:var(--ok)}
.prov.extrait{background:rgba(107,155,216,.1);color:#4a7cb8}
.prov.deduit{background:rgba(199,162,72,.12);color:#8a7126}
.prov.confirme{background:rgba(181,98,62,.1);color:#8a4a30}

/* ===== Forms ===== */
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.fld{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--mono);margin-bottom:5px;font-weight:500}
label.fld .req{color:var(--terra)}
label.fld .opt{color:var(--muted);opacity:.6;font-weight:400}
input.fld,select.fld,textarea.fld{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;font-size:13px;color:var(--ink);transition:border .15s;outline:none}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.12)}
input.fld.mono,select.fld.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:5px;font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--anthracite);color:#fff}
.btn-primary:hover{background:#2d3640}
.btn-gold{background:var(--gold);color:var(--anthracite)}
.btn-gold:hover{background:#d4b05a}
.btn-outline{border:1px solid var(--line2);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-terra{background:var(--terra);color:#fff}
.btn-terra:hover{background:#c4714f}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-ghost{color:var(--muted);font-size:11px;padding:4px 8px}
.btn-ghost:hover{color:var(--ink)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(30,36,43,.4);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:780px;width:100%;margin:0 auto}
.modal.lg{max-width:920px}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;color:var(--anthracite)}
.modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--gris);color:var(--ink)}

/* ===== Alerts ===== */
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-sm);border:1px solid;font-size:12px;margin-bottom:8px}
.alert.err{border-color:rgba(169,56,41,.2);background:rgba(169,56,41,.04)}
.alert.warn{border-color:rgba(184,134,47,.2);background:rgba(184,134,47,.04)}
.alert.ok{border-color:rgba(45,125,70,.2);background:rgba(45,125,70,.04)}
.alert.info{border-color:rgba(107,155,216,.2);background:rgba(107,155,216,.04)}
.alert .ai{flex-shrink:0;width:20px;text-align:center;font-size:14px}
.alert .at{font-weight:600;margin-bottom:2px}
.alert .ad{color:var(--muted);font-size:11px;font-family:var(--mono)}
.alert-clickable{cursor:pointer;transition:all .15s}
.alert-clickable:hover{box-shadow:var(--shadow)}

/* ===== Misc ===== */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono);margin-bottom:10px;margin-top:6px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
.compliance-bar{height:6px;border-radius:3px;background:var(--gris);overflow:hidden;margin-top:4px}
.compliance-fill{height:100%;border-radius:3px;transition:width .5s}

/* ===== Toast ===== */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--anthracite);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.toast.ok .dot{background:var(--ok)}
.toast.err .dot{background:var(--err)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== Detail grid (modal) ===== */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.detail-grid .dg-row{display:contents}
.detail-grid .dg-label,.detail-grid .dg-val{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px}
.detail-grid .dg-label{background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:500;border-right:1px solid var(--line)}
.detail-grid .dg-val{font-family:var(--mono);font-size:11px}

/* ===== Connexion cards ===== */
.conn-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.conn-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;transition:box-shadow .15s}
.conn-card:hover{box-shadow:var(--shadow-md)}
.conn-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.conn-name{font-size:13px;font-weight:600;color:var(--anthracite)}
.conn-type{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.conn-status{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:10px}
.conn-status.connecte{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.conn-status.preparation{background:rgba(184,134,47,.08);color:var(--warn);border:1px solid rgba(184,134,47,.15)}
.conn-status .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
.conn-fields{font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.6;margin-top:8px}
.conn-meta{display:flex;gap:12px;margin-top:10px;font-size:10px;font-family:var(--mono);color:var(--muted);flex-wrap:wrap}
.conn-meta span{white-space:nowrap}

/* ===== Stock movement log ===== */
.movement{display:grid;grid-template-columns:120px 60px 1fr 80px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px}
.movement:last-child{border-bottom:none}
.movement .mv-date{font-family:var(--mono);font-size:10px;color:var(--muted)}
.movement .mv-type{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:3px}
.movement .mv-type.entree{background:rgba(45,125,70,.1);color:var(--ok)}
.movement .mv-type.sortie{background:rgba(181,98,62,.1);color:#8a4a30}
.movement .mv-desc{font-size:11px}
.movement .mv-qty{font-family:var(--mono);text-align:right;font-size:11px}

/* ===== Quick links ===== */
.quick-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.quick-link{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.quick-link:hover{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.08)}
.quick-link .ql-ico{font-size:18px;opacity:.6}
.quick-link .ql-label{font-size:12px;font-weight:500}
.quick-link .ql-sub{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ===== Profil ===== */
.info-row{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.info-row:last-child{border-bottom:none}
.info-row .ir-label{color:var(--muted);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.info-row .ir-val{font-size:13px}
.info-row .ir-val .mono{font-family:var(--mono);font-size:12px}

/* ===== Responsive ===== */
@media(max-width:840px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .conn-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .detail-grid .dg-label{border-right:none;border-bottom:1px solid var(--line)}
}


/* Docs-compatible variables */
  --green: #4a8a3e; --amber: #d4a52a; --red: #b53e2e; --blue: #3a6a9e;
  --ink-2: #3a4450; --paper-2: #f2f1ec;

/* ===== Regulatory module CSS ===== */

:root{
  --anthracite:#1e242b; --gold:#c7a248; --terra:#b5623e; --paper:#fafaf8;
  --gris:#eaece8; --gris2:#d4d7d2; --ink:#2a2f36; --muted:#6b7280;
  --line:#e2e5e0; --line2:#cfd3cc; --ok:#2d7d46; --warn:#b8862f; --err:#a93829;
  --r:8px; --r-sm:5px; --r-lg:14px;
  --shadow:0 1px 3px rgba(30,36,43,.06),0 1px 2px rgba(30,36,43,.04);
  --shadow-md:0 4px 12px rgba(30,36,43,.08),0 2px 4px rgba(30,36,43,.04);
  --shadow-lg:0 12px 32px rgba(30,36,43,.12),0 4px 8px rgba(30,36,43,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:inherit;text-decoration:none}
::selection{background:rgba(199,162,72,.25)}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--anthracite);color:#c8cdd3;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.brand{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--gold),var(--terra));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--anthracite);font-family:var(--mono)}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.brand-sub{font-size:9px;color:rgba(255,255,255,.4);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.nav-group-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);font-family:var(--mono);padding:14px 14px 7px;display:block}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;color:rgba(255,255,255,.55);transition:all .12s;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.nav-item .ico{width:15px;height:15px;flex-shrink:0;opacity:.7;text-align:center}
.nav-count{margin-left:auto;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}
.sidebar-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:rgba(255,255,255,.3);font-family:var(--mono);line-height:1.6}
.sidebar-foot a{color:var(--gold);opacity:.7}
.sidebar-foot a:hover{opacity:1}

.main{overflow-y:auto;background:var(--paper)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--gris2);border-radius:3px}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.topbar-role{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-meta{font-size:11px;font-family:var(--mono);color:var(--muted)}
.topbar-btn{font-size:11px;font-family:var(--mono);color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:5px;transition:all .15s;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.topbar-btn:hover{border-color:var(--gold);color:var(--ink)}
.content{padding:24px;max-width:1320px}

/* ===== Cards ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite)}
.card-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card-body{padding:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ===== KPI ===== */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono)}
.kpi-val{font-size:26px;font-weight:600;font-family:var(--mono);margin:6px 0 2px;letter-spacing:-0.02em;color:var(--anthracite)}
.kpi-unit{font-size:13px;color:var(--muted);font-weight:400}
.kpi-delta{font-size:11px;font-family:var(--mono);margin-top:4px}
.kpi-delta.pos{color:var(--ok)}
.kpi-delta.neg{color:var(--err)}
.kpi-delta.neu{color:var(--muted)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r);background:var(--gris)}
.kpi.accent::before{background:var(--gold)}
.kpi.terra::before{background:var(--terra)}
.kpi.ok::before{background:var(--ok)}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(199,162,72,.03)}
.tbl td .mono{font-family:var(--mono);font-size:11px}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl-wrap{overflow-x:auto}
.row-clickable{cursor:pointer}

/* ===== Badges ===== */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.gold{background:rgba(199,162,72,.12);color:#8a7126;border:1px solid rgba(199,162,72,.2)}
.tag.terra{background:rgba(181,98,62,.1);color:#8a4a30;border:1px solid rgba(181,98,62,.2)}
.tag.ok{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.tag.warn{background:rgba(184,134,47,.1);color:var(--warn);border:1px solid rgba(184,134,47,.2)}
.tag.err{background:rgba(169,56,41,.08);color:var(--err);border:1px solid rgba(169,56,41,.15)}
.tag.neu{background:var(--gris);color:var(--muted);border:1px solid var(--line)}
.tag.info{background:rgba(107,155,216,.08);color:#4a7cb8;border:1px solid rgba(107,155,216,.15)}
.prov{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;font-weight:600}
.prov.saisi{background:rgba(45,125,70,.1);color:var(--ok)}
.prov.extrait{background:rgba(107,155,216,.1);color:#4a7cb8}
.prov.deduit{background:rgba(199,162,72,.12);color:#8a7126}
.prov.confirme{background:rgba(181,98,62,.1);color:#8a4a30}

/* ===== Forms ===== */
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.fld{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--mono);margin-bottom:5px;font-weight:500}
label.fld .req{color:var(--terra)}
label.fld .opt{color:var(--muted);opacity:.6;font-weight:400}
label.fld .cond{color:var(--warn);font-weight:400}
input.fld,select.fld,textarea.fld{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;font-size:13px;color:var(--ink);transition:border .15s;outline:none}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.12)}
input.fld.invalid{border-color:var(--err);background:rgba(169,56,41,.03)}
input.fld.mono,select.fld.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:5px;font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--anthracite);color:#fff}
.btn-primary:hover{background:#2d3640}
.btn-gold{background:var(--gold);color:var(--anthracite)}
.btn-gold:hover{background:#d4b05a}
.btn-outline{border:1px solid var(--line2);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-terra{background:var(--terra);color:#fff}
.btn-terra:hover{background:#c4714f}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-ghost{color:var(--muted);font-size:11px;padding:4px 8px;cursor:pointer}
.btn-ghost:hover{color:var(--ink)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(30,36,43,.4);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:820px;width:100%;margin:0 auto}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;color:var(--anthracite)}
.modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close:hover{background:var(--gris);color:var(--ink)}

/* ===== Flow steps ===== */
.flow-steps{display:flex;gap:0;margin-bottom:20px;flex-wrap:wrap}
.flow-step{flex:1;min-width:120px;position:relative;padding:10px 12px;border-top:2px solid var(--line);font-size:11px;transition:all .2s}
.flow-step .step-n{font-size:9px;font-family:var(--mono);color:var(--muted)}
.flow-step .step-t{font-weight:600;margin-top:2px;color:var(--ink)}
.flow-step.active{border-top-color:var(--gold);background:rgba(199,162,72,.04)}
.flow-step.done{border-top-color:var(--ok)}
.flow-step.done .step-n{color:var(--ok)}
.flow-step.done .step-t{color:var(--ok)}
.flow-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;min-height:300px}
.flow-step-title{font-size:16px;font-weight:600;margin-bottom:4px}
.flow-step-desc{font-size:12px;color:var(--muted);margin-bottom:16px}
.flow-field{display:grid;grid-template-columns:180px 1fr 90px 80px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.flow-field:last-child{border-bottom:none}
.flow-field .ff-label{font-weight:500}
.flow-field .ff-val{font-family:var(--mono);font-size:11px}
.conf-bar{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono)}
.conf-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conf-hi{background:var(--ok)}
.conf-md{background:var(--warn)}
.conf-lo{background:var(--err)}

/* ===== Alerts ===== */
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-sm);border:1px solid;font-size:12px;margin-bottom:8px}
.alert.err{border-color:rgba(169,56,41,.2);background:rgba(169,56,41,.04)}
.alert.warn{border-color:rgba(184,134,47,.2);background:rgba(184,134,47,.04)}
.alert.ok{border-color:rgba(45,125,70,.2);background:rgba(45,125,70,.04)}
.alert .ai{flex-shrink:0;width:20px;text-align:center;font-size:14px}
.alert .at{font-weight:600;margin-bottom:2px}
.alert .ad{color:var(--muted);font-size:11px;font-family:var(--mono)}

/* ===== Misc ===== */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:18px 0}
.hidden{display:none!important}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--anthracite);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.compliance-bar{height:6px;border-radius:3px;background:var(--gris);overflow:hidden;margin-top:4px}
.compliance-fill{height:100%;border-radius:3px;transition:width .5s}

/* ===== Ceres Prev specific ===== */
.prev-map{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.canton-cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;text-align:center;transition:all .15s;cursor:pointer}
.canton-cell:hover{border-color:var(--gold);background:rgba(199,162,72,.03)}
.canton-cell.selected{border-color:var(--gold);background:rgba(199,162,72,.06);box-shadow:0 0 0 2px rgba(199,162,72,.15)}
.canton-cell .cn{font-size:11px;font-weight:600;color:var(--anthracite)}
.canton-cell .cy{font-size:18px;font-family:var(--mono);font-weight:600;color:var(--gold);margin:4px 0}
.canton-cell .ci{font-size:10px;font-family:var(--mono);color:var(--muted)}
.feature-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feature-bar .fl{width:110px;font-size:11px;font-family:var(--mono);color:var(--muted)}
.feature-bar .fb{flex:1;height:8px;border-radius:4px;background:var(--gris);overflow:hidden}
.feature-bar .ff{height:100%;border-radius:4px}
.feature-bar .fv{width:42px;text-align:right;font-size:11px;font-family:var(--mono);font-weight:600}
.chart-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.chart-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite);margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:14px}
.legend{display:flex;gap:16px;font-size:11px;font-family:var(--mono);margin-bottom:10px}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:3px;border-radius:2px}
.pred-card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:linear-gradient(135deg,rgba(199,162,72,.04),rgba(181,98,62,.02))}
.pred-big{font-size:32px;font-family:var(--mono);font-weight:600;color:var(--anthracite);letter-spacing:-0.02em}
.pred-unit{font-size:14px;color:var(--muted);font-weight:400}
.pred-ci{font-size:12px;font-family:var(--mono);color:var(--muted);margin-top:6px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric-cell{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;text-align:center}
.metric-cell .ml{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono)}
.metric-cell .mv{font-size:18px;font-family:var(--mono);font-weight:600;color:var(--anthracite);margin:4px 0}
.metric-cell .mh{font-size:10px;font-family:var(--mono);color:var(--muted)}
.parcelle-pred-row{display:grid;grid-template-columns:1fr 80px 90px 100px 80px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.parcelle-pred-row:hover{background:rgba(199,162,72,.03)}
.parcelle-pred-row.selected{background:rgba(199,162,72,.06)}
.parcelle-pred-row:last-child{border-bottom:none}


/* ===== Docs module CSS ===== */
/* ===== Header ===== */
.page-head { margin-bottom: 22px; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.page-sub { font-size: 12px; color: var(--muted); font-family: var(--mono); }

/* ===== Stat grid ===== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.stat-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px 16px; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--mono); }
.stat-value { font-size: 26px; font-weight: 700; margin-top: 6px; line-height: 1; }
.stat-unit { font-size: 11px; color: var(--muted); font-weight: 400; }
.stat-trend { font-size: 10px; margin-top: 8px; font-family: var(--mono); }
.trend-up { color: var(--green); }
.trend-down { color: var(--red); }

/* ===== Card ===== */
.card { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
.card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 600; }
.card-title .ico { color: var(--gold); margin-right: 6px; }
.card-meta { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.card-body { padding: 16px 18px; }

/* ===== Table ===== */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; padding: 8px 10px; background: var(--paper-2); border-bottom: 1px solid var(--line); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--paper); }

/* progress bar */
.bar { display: inline-block; width: 80px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.bar-fill { height: 100%; border-radius: 3px; }
.pct { font-family: var(--mono); font-size: 11px; font-weight: 600; }

/* badge */
.badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; font-family: var(--mono); }
.badge-ok { background: #d6e8c9; color: #2d5a1e; }
.badge-warn { background: #f5e6b8; color: #8a6b15; }
.badge-fail { background: #f0c9c0; color: #8e2e1a; }
.badge-info { background: #cfd8e8; color: #2a4a6e; }
.badge-green { background: #d6e8c9; color: #2d5a1e; }
.badge-amber { background: #f5e6b8; color: #8a6b15; }
.badge-red { background: #f0c9c0; color: #8e2e1a; }
.badge-blue { background: #cfd8e8; color: #2a4a6e; }

/* alert */
.alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: 6px; margin-bottom: 8px; font-size: 12.5px; }
.alert-ico { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.alert-crit { background: #f0c9c0; }
.alert-crit .alert-ico { background: var(--red); color: #fff; }
.alert-warn { background: #fdf3dc; }
.alert-warn .alert-ico { background: var(--amber); color: #fff; }
.alert-info { background: #e1e8f0; }
.alert-info .alert-ico { background: var(--blue); color: #fff; }
.alert-ok { background: #e0eed2; }
.alert-ok .alert-ico { background: var(--green); color: #fff; }
.alert-title { font-weight: 600; }
.alert-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* commune cards */
.geo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.commune-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; text-align: center; }
.commune-name { font-weight: 600; font-size: 13px; margin-bottom: 8px; }
.commune-pct { font-size: 24px; font-weight: 700; font-family: var(--mono); }
.commune-meta { font-size: 10px; color: var(--muted); margin-top: 6px; }

/* dist bar */
.dist { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
.dist-green { background: var(--green); }
.dist-amber { background: var(--amber); }
.dist-red { background: var(--red); }
.dist-label { flex: 0 0 25%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 600; font-family: var(--mono); }

/* ===== Chat ===== */
.chat-wrap { display: grid; grid-template-columns: 1fr 240px; gap: 18px; align-items: start; }
.chat { background: #fff; border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; height: 580px; }
.chat-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.chat-head .av { width: 30px; height: 30px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--anthracite); font-size: 13px; }

.chat-head .st { font-size: 10px; color: var(--green); font-family: var(--mono); }
.chat-head .st::before { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--green); border-radius: 50%; margin-right: 4px; }
.chat-body { flex: 1; overflow-y: auto; padding: 16px; }
.msg { margin-bottom: 16px; }
.msg .role { font-size: 10px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.msg .bubble { background: var(--paper-2); padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid var(--line); }
.msg.user .role { color: var(--terra); }
.msg.user .bubble { background: #fff; border-left: 3px solid var(--terra); }
.msg.assistant .bubble { background: var(--paper-2); }
.typing { display: none; }
.typing.active { display: block; }
.typing-dots span { display: inline-block; width: 6px; height: 6px; background: var(--muted); border-radius: 50%; margin: 0 2px; animation: blink 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
.chat-foot { padding: 12px; border-top: 1px solid var(--line); }
.chat-input { display: flex; gap: 8px; }
.chat-input textarea { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-family: var(--sans); font-size: 13px; resize: none; height: 40px; }
.chat-input textarea:focus { outline: none; border-color: var(--gold); }
.chat-input button { background: var(--anthracite); color: #fff; border: none; border-radius: 6px; padding: 0 18px; font-weight: 600; cursor: pointer; font-size: 13px; }
.chat-input button:hover { background: var(--terra); }
.chat-foot .ai-notice { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 8px; text-align: center; }

.suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.sugg { background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
.sugg:hover { background: var(--gold); color: var(--anthracite); border-color: var(--gold); }

/* action blocks in chat */
.action-block { background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin-top: 8px; font-size: 12px; }
.action-block .ab-head { font-weight: 600; font-size: 11px; color: var(--terra); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.action-block .ab-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11.5px; }
.action-block .ab-row .k { color: var(--muted); }
.action-block .ab-row .v { font-family: var(--mono); font-weight: 600; }
.action-block .ab-ok { color: var(--green); }
.action-block .ab-warn { color: var(--amber); }

.chat-side { }
.chat-side .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.chat-side .panel h4 { font-size: 12px; margin-bottom: 8px; }
.chat-side .panel p { font-size: 11px; color: var(--muted); margin-bottom: 6px; }

.trace-item { display: grid; grid-template-columns: 130px 90px 1fr 60px; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 12.5px; }
.trace-item:last-child { border-bottom: none; }
.trace-time { font-family: var(--mono); font-size: 10px; color: var(--muted); }

.trace-desc { }
.trace-status { text-align: right; font-size: 10px; font-family: var(--mono); font-weight: 600; }

.src-card h4 { font-size: 13px; margin-bottom: 4px; }

.src-cat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); font-weight: 600; margin: 18px 0 10px; }

.prd-face { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }

.prd-face .pf-agent { background: #f5e6b8; color: #8a6b15; }
.prd-face p { font-size: 12px; color: var(--ink-2); }

.proto-step:not(:last-child)::after { content: ''; position: absolute; top: 12px; right: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.proto-step .ps-name { font-size: 10px; font-weight: 600; position: relative; z-index: 1; }
.proto-step .ps-desc { font-size: 9px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

.rm-phase:last-child { border-right: none; }
.rm-phase .rm-tag { font-size: 10px; font-family: var(--mono); color: var(--gold); font-weight: 600; }
.rm-phase .rm-name { font-size: 12px; font-weight: 600; margin: 4px 0; }
.rm-phase .rm-date { font-size: 10px; color: var(--muted); font-family: var(--mono); }

/* timeline */

.tl-item { position: relative; margin-bottom: 14px; }
.tl-item::before { content: ''; position: absolute; left: -21px; top: 4px; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; }
.tl-date { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--terra); }
.tl-text { font-size: 12px; color: var(--ink-2); }

/* reco list */

.reco p { font-size: 12px; color: var(--ink-2); }

@media (max-width: 900px) {

  .chat-wrap { grid-template-columns: 1fr; }
  .chat-side { display: none; }
  .prd-grid, .advice-grid { grid-template-columns: 1fr; }
  .roadmap { flex-direction: column; }

window.App = {
  state: {
    role: 'exploitant',
    view: 'dashboard',
    sortCol: null,
    sortDir: 'asc',
  },
  views: {},
  data: DATA,

  init() {
    this.renderNav();
    this.render();
    this.updateMeta();
  },

  setRole(role) {
    this.state.role = role;
    // Set default view per role
    if (role === 'exploitant') this.state.view = 'dashboard';
    else if (role === 'coop') this.state.view = 'coop-vue-agregee';
    else this.state.view = 'agent-chat';
    document.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
    this.renderNav();
    this.render();
    this.updateMeta();
  },

  navigateTo(viewId) {
    this.state.view = viewId;
    this.render();
    this.updateMeta();
  },

  registerView(id, fn) {
    this.views[id] = fn;
  },

  render() {
    // Update nav active
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === this.state.view));

    // Render content
    const c = document.getElementById('content');
    const viewFn = this.views[this.state.view];
    if (viewFn) {
      c.innerHTML = viewFn.call(this);
      // Run onMount if provided
      if (this._onMount) { this._onMount(); this._onMount = null; }
    } else {
      c.innerHTML = '<div class="empty">Module non disponible: ' + this.state.view + '</div>';
    }

    // Update page title
    const title = TITLES[this.state.view] || this.state.view;
    document.getElementById('pageTitle').textContent = title;
    const bc = document.getElementById('topbarBreadcrumb');
    if (bc) bc.innerHTML = '<span class="sep">/</span>' + (this.state.role === 'exploitant' ? 'Exploitation' : this.state.role === 'coop' ? 'Cooperative' : 'Agent') + '<span class="sep">/</span>' + title;
  },

  renderNav() {
    const container = document.getElementById('navContainer');
    const items = NAV_CONFIG[this.state.role] || [];
    let html = '<div class="nav-group-label">' + (this.state.role === 'exploitant' ? 'Exploitation' : this.state.role === 'coop' ? 'Cooperative' : 'Agent Ceres') + '</div>';
    html += '<div class="nav">';
    items.forEach(item => {
      const count = item.count ? item.count() : '';
      const countHtml = count !== '' ? '<span class="nav-count">' + count + '</span>' : '';
      html += '<button class="nav-item' + (this.state.view === item.id ? ' active' : '') + '" data-view="' + item.id + '" onclick="App.navigateTo(\'' + item.id + '\')"><span class="ico">' + item.ico + '</span>' + item.label + countHtml + '</button>';
    });
    html += '</div>';
    container.innerHTML = html;
  },

  updateMeta() {
    const meta = document.getElementById('topbarMeta');
    const pill = document.getElementById('rolePill');
    if (this.state.role === 'exploitant') {
      meta.textContent = 'SIRET ' + DATA.exploitation.siret + ' · ' + DATA.exploitation.department;
      pill.textContent = 'Exploitant';
    } else if (this.state.role === 'coop') {
      meta.textContent = 'Cantal Cereales · 5 adherents';
      pill.textContent = 'Cooperative';
    } else {
      meta.textContent = 'Agent Ceres · GLM-5.2';
      pill.textContent = 'Agent';
    }
  },

  toast(msg, type) {
    const t = document.createElement('div');
    t.className = 'toast' + (type ? ' ' + type : '');
    t.innerHTML = '<span class="dot"></span>' + msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3500);
  },

  openModal(title, bodyHTML, onMount, opts) {
    const modal = document.getElementById('modalContent');
    const sizeClass = opts && opts.size === 'lg' ? ' lg' : '';
    modal.innerHTML = '<div class="modal' + sizeClass + '">' +
      '<div class="modal-head"><div><div class="modal-title">' + title + '</div></div>' +
      '<button class="modal-close" onclick="App.closeModal()">&times;</button></div>' +
      '<div class="modal-body">' + bodyHTML + '</div>' +
      '</div>';
    document.getElementById('modalOverlay').classList.add('show');
    if (onMount) onMount();
  },

  closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  },

  exportData() {
    const json = JSON.stringify({ app:'FarmCockpit', version:'1.0', generated: new Date().toISOString(), data: DATA }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'farmcockpit_export.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    this.toast('Export JSON telecharge');
  },

  // Helpers
  fmtDate(d) {
    return new Date(d).toLocaleDateString('fr-FR');
  },
  fmtEuro(n) {
    return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR';
  },
  totalSurface() {
    return DATA.parcels.reduce((s, p) => s + p.surface, 0);
  },
  conformitePct() {
    const total = DATA.parcels.length;
    const ok = DATA.parcels.filter(p => p.conformite === 'ok').length;
    return Math.round((ok / total) * 100);
  },
};

App.sortTable = function(col) {
  // Simple sort toggle
  if (App.state.sortCol === col) {
    App.state.sortDir = App.state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    App.state.sortCol = col;
    App.state.sortDir = 'asc';
  }
  DATA.parcels.sort((a, b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'number') return App.state.sortDir === 'asc' ? va - vb : vb - va;
    va = String(va); vb = String(vb);
    return App.state.sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });
  App.render();
  App.toast('Tri par ' + col + ' (' + App.state.sortDir + ')');
};

function conformite() {
  if (!REGISTRE.length) return 100;
  const checks = REGISTRE.map(r => {
    let ok = 0, total = 17;
    if (r.siretDetenteur && r.siretDetenteur.length===14) ok++;
    if (r.siretBeneficiaire) ok++;
    if (r.produit) ok++;
    if (r.amm && r.amm.length===7) ok++;
    if (r.dateUtilisation) ok++;
    if (r.horaireDebut) ok++; else if (!AMM_DB[r.amm]?.horaire) ok++;
    if (r.horaireFin) ok++; else if (!AMM_DB[r.amm]?.horaire) ok++;
    if (r.delaiRentree) ok++;
    if (r.dose && r.dose>0) ok++;
    if (r.cible || true) ok++;
    if (r.modeApplication || true) ok++;
    if (r.ilot && r.parcelle && r.insee) ok++;
    if (r.gps) ok++;
    if (r.surface && r.surface>0) ok++;
    if (r.culture) ok++;
    if (r.bbch) ok++;
    if (r.biologique) ok++;
    return ok / total;
  });
  return Math.round(checks.reduce((s,c)=>s+c,0) / checks.length * 100);
}

    el.classList.remove('active', 'done');
    if (i < flowStep) el.classList.add('done');

  }
}

function flowControles(panel, controls) {
  const r = flowData.raw;
  const amm = r.amm.val;
  const ammInfo = AMM_DB[amm];
  const parc = PARCELLES.find(p => p.ilot === r.ilot.val && p.parcelle === r.parcelle.val && p.insee === r.insee.val);
  const dose = parseFloat(r.dose.val);
  const surface = parc ? parc.surface : 0;
  const qtyNeeded = dose * surface;
  const checks = [
    { label:'Dose x surface <= quantite disponible', ok:true, detail: dose + ' ' + ammInfo.unite + ' x ' + surface + ' ha = ' + qtyNeeded.toFixed(2) + ' ' + ammInfo.unite + ' (stock: 25 ' + ammInfo.unite + ')' },

  ];

function collectQuestions() {
  const r = flowData.raw;
  Object.keys(r).forEach(k => {
    const el = document.getElementById('qf-' + k);
    if (el && el.value) { r[k].val = el.value; r[k].conf = 1.0; r[k].confirmed = true; }
  });
}

function flowValidation(panel, controls) {
  const r = flowData.raw;
  const rows = Object.entries(r).map(([k,v]) => {
    const prov = v.confirmed ? 'confirme' : v.conf >= 0.8 ? 'extrait' : v.conf >= 0.5 ? 'deduit' : 'saisi';
    return `<div class="flow-field">
      <div class="ff-label">${fieldLabel(k)}</div>
      <div class="ff-val">${v.val || '<span class="muted">-</span>'}</div>
      <div><span class="conf-bar"><span class="conf-dot ${v.conf>=0.8?'conf-hi':v.conf>=0.5?'conf-md':'conf-lo'}"></span> ${Math.round(v.conf*100)}%</span></div>

function autoFill(name) {
  App.toast('Pre-remplissage lance: ' + name);
  addTrace('DECLARATION', 'Pre-remplissage: ' + name);
}

function pacConformite() {
  let ok = 0, total = 0;
  PARCELLES.forEach(p => {
    const checks = [p.surface >= 5, p.culture !== 'BRAAN' || p.surface < 20, true, p.ilot !== '9999'];
    checks.forEach(c => { total++; if (c) ok++; });
  });
  return Math.round((ok / total) * 100);
}

function renderPrevChart() {
  const w = 720, h = 240, pad = { l: 50, r: 20, t: 20, b: 40 };
  const xs = RETRO.map((_, i) => pad.l + (i / (RETRO.length - 1)) * (w - pad.l - pad.r));
  const allVals = RETRO.flatMap(r => [r.pred, r.actuel, 61.2]);
  const yMin = Math.min(...allVals) - 3;
  const yMax = Math.max(...allVals) + 3;
  const yScale = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (h - pad.t - pad.b);

  const predPts = RETRO.map((r, i) => `${xs[i]},${yScale(r.pred)}`).join(' ');
  const actPts = RETRO.map((r, i) => `${xs[i]},${yScale(r.actuel)}`).join(' ');
  const avgY = yScale(61.2);

  const gridLines = [];
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (i / 4) * (yMax - yMin);
    gridLines.push(`<line x1="${pad.l}" y1="${yScale(v)}" x2="${w - pad.r}" y2="${yScale(v)}" stroke="var(--gris)" stroke-width="1"/>`);
    gridLines.push(`<text x="${pad.l - 8}" y="${yScale(v) + 4}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">${v.toFixed(0)}</text>`);
  }
  const xLabels = RETRO.map((r, i) => `<text x="${xs[i]}" y="${h - pad.b + 16}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${r.annee}</text>`);

  const predDots = RETRO.map((r, i) => `<circle cx="${xs[i]}" cy="${yScale(r.pred)}" r="4" fill="var(--gold)"/>`);
  const actDots = RETRO.map((r, i) => `<circle cx="${xs[i]}" cy="${yScale(r.actuel)}" r="4" fill="var(--terra)"/>`);

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${gridLines.join('')}
    <line x1="${pad.l}" y1="${avgY}" x2="${w - pad.r}" y2="${avgY}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <text x="${w - pad.r}" y="${avgY - 6}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="var(--muted)">moy. 61.2</text>
    <polyline points="${predPts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
    <polyline points="${actPts}" fill="none" stroke="var(--terra)" stroke-width="2"/>
    ${predDots.join('')}
    ${actDots.join('')}
    ${xLabels.join('')}
  </svg>`;
}

const CSV_HEADERS = [
  'siret_detenteur','siret_beneficiaire','produit','amm','date_utilisation',
  'horaire_debut','horaire_fin','delai_rentree_anticipee','dose','dose_unite',
  'cible','mode_application','ilot_rpg','parcelle_rpg','commune_insee',
  'gps_wgs84','surface_traitee_ha','culture_oepp','stade_bbch','conduite_biologique',
  'provenance','timestamp','version','author'
];

function buildCSV() {
  const rows = [CSV_HEADERS];
  REGISTRE.forEach(r => {
    rows.push([
      r.siretDetenteur, r.siretBeneficiaire, r.produit, r.amm, r.dateUtilisation,
      r.horaireDebut, r.horaireFin, r.delaiRentree, r.dose, r.doseUnite,
      r.cible, r.modeApplication, r.ilot, r.parcelle, r.insee,
      r.gps, r.surface, r.culture, r.bbch, r.biologique,
      r.provenance, r.timestamp, r.version, r.author
    ]);
  });
  return '\ufeff' + rows.map(row => row.map(c => {
    const s = String(c == null ? '' : c);
    return s.includes(';') || s.includes('"') ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}

function exportCSV() {
  if (REGISTRE.length === 0) { App.toast('Registre vide · rien a exporter'); return; }
  const csv = buildCSV();
  downloadFile('ceres_registre_phyto.csv', csv, 'text/csv;charset=utf-8');
  App.toast('CSV exporte · ' + REGISTRE.length + ' ligne(s) · 17 colonnes · UTF-8 BOM');
  addTrace('EXPORT', 'CSV · ' + REGISTRE.length + ' lignes · UTF-8 BOM · delimiteur ;');
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function renderCoop() {
  const totalAdh = ADHERENTS.length;
  const totalSurf = ADHERENTS.reduce((a, e) => a + e.surface, 0);
  const avgConf = Math.round(ADHERENTS.reduce((a, e) => a + e.conformite, 0) / ADHERENTS.length);
  const totalRet = ADHERENTS.reduce((a, e) => a + e.retards, 0);

  document.getElementById('coop-stats').innerHTML = [
    { l: 'Adherents', v: totalAdh, u: '', t: 'Coop Cantal', tc: '' },
    { l: 'Surface totale', v: totalSurf.toFixed(1), u: ' ha', t: '5 communes', tc: '' },
    { l: 'Conformite moy.', v: avgConf, u: '%', t: 'registre phyto', tc: '' },
    { l: 'Retards totaux', v: totalRet, u: '', t: '2 critiques', tc: 'trend-down' },
  ].map(s => `<div class="stat-card"><div class="stat-label">${s.l}</div><div class="stat-value">${s.v}<span class="stat-unit">${s.u}</span></div><div class="stat-trend ${s.tc}">${s.t}</div></div>`).join('');

  const green = ADHERENTS.filter(e => e.conformite >= 85).length;
  const amber = ADHERENTS.filter(e => e.conformite >= 70 && e.conformite < 85).length;
  const red = ADHERENTS.filter(e => e.conformite < 70).length;
  const total = ADHERENTS.length;
  document.getElementById('dist-bar').innerHTML =
    `<div class="dist-green dist-label" style="flex-basis:${green/total*100}%">${green}</div>` +
    `<div class="dist-amber dist-label" style="flex-basis:${amber/total*100}%">${amber}</div>` +
    `<div class="dist-red dist-label" style="flex-basis:${red/total*100}%">${red}</div>`;

  const sorted = [...ADHERENTS].sort((a, b) => a.conformite - b.conformite);
  document.querySelector('#adherents-table tbody').innerHTML = sorted.map(e => {
    const c = e.conformite;
    const cls = c >= 85 ? 'badge-green' : c >= 70 ? 'badge-amber' : 'badge-red';
    const col = c >= 85 ? 'var(--green)' : c >= 70 ? 'var(--amber)' : 'var(--red)';
    const rcls = e.retards === 0 ? 'badge-ok' : e.retards <= 2 ? 'badge-warn' : 'badge-fail';
    return `<tr>
      <td><b>${e.nom}</b></td>
      <td>${e.commune}</td>
      <td style="text-align:right">${e.parcelles}</td>
      <td style="text-align:right" class="mono">${e.surface.toFixed(1)} ha</td>
      <td><span class="bar"><span class="bar-fill" style="width:${c}%;background:${col}"></span></span><span class="pct">${c}%</span> <span class="badge ${cls}">${c>=85?'OK':c>=70?'ATT':'NOK'}</span></td>
      <td style="text-align:right"><span class="badge ${rcls}">${e.retards}</span></td>
    </tr>`;
  }).join('');

  const sevOrder = { crit: 0, warn: 1, info: 2, ok: 3 };
  const sortedAlerts = [...ALERTS].sort((a, b) => sevOrder[a.sev] - sevOrder[b.sev]);
  document.getElementById('alerts-box').innerHTML = sortedAlerts.map(a =>
    `<div class="alert alert-${a.sev}"><div class="alert-ico">${a.ico}</div><div><div class="alert-title">${a.title}</div><div class="alert-sub">${a.sub}</div></div></div>`
  ).join('');
  const critCount = ALERTS.filter(a => a.sev === 'crit').length;
  document.getElementById('alert-count').textContent = `${ALERTS.length} alertes / ${critCount} critiques`;

  const communes = {};
  ADHERENTS.forEach(e => {
    if (!communes[e.commune]) communes[e.commune] = { list: [], surf: 0 };
    communes[e.commune].list.push(e.conformite);
    communes[e.commune].surf += e.surface;
  });
  document.getElementById('communes').innerHTML = Object.entries(communes).map(([name, d]) => {

function sendChat() {
  const input = document.getElementById('chat-text');
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text);
  input.value = '';
  showTyping();
  const key = text.toLowerCase().replace(/[?'.]/g, '').trim();
  setTimeout(() => {
    removeTyping();
    let matched = null;
    for (const k of Object.keys(RESPONSES)) {
      if (key.includes(k) || k.includes(key)) { matched = k; break; }
    }
    if (matched) {
      addMsg('assistant', RESPONSES[matched]());
    } else {
      addMsg('assistant', `Je n'ai pas d'action correspondante. Essayez: pre-remplir la PAC, verifier le registre phyto, ajouter un traitement, exporter le registre, calculer l'IFT, verifier le stock, ou les alertes.`);
    }
  }, 700 + Math.random() * 600);
}

    });
    const html = Object.entries(communes).map(([name, d]) => {
      const avg = Math.round(d.list.reduce((a, b) => a + b, 0) / d.list.length);
      const col = avg >= 85 ? 'var(--green)' : avg >= 70 ? 'var(--amber)' : 'var(--red)';
      return '<div class="commune-card"><div class="commune-name">' + name + '</div><div class="commune-pct" style="color:' + col + '">' + avg + '%</div><div class="commune-meta">' + d.list.length + ' adherents / ' + d.surf.toFixed(0) + ' ha</div></div>';
    }).join('');
    document.getElementById('content').innerHTML = 
      '<div class="page-head"><div class="page-title">Carto conformite</div><div class="page-sub">Conformite registre phyto par commune · Cantal (15)</div></div>' +
      '<div class="card"><div class="card-body"><div class="geo-grid">' + html + '</div></div></div>';
  };
  return '<div class="empty">Chargement...</div>';
});
