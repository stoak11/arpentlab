<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceres · FarmCockpit : Arpent Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --anthracite:#1e242b; --gold:#c7a248; --terra:#b5623e; --paper:#fafaf8;
  --gris:#eaece8; --gris2:#d4d7d2; --ink:#2a2f36; --muted:#6b7280;
  --line:#e2e5e0; --line2:#cfd3cc; --ok:#2d7d46; --warn:#b8862f; --err:#a93829;
  --r:8px; --r-sm:5px; --r-lg:14px;
  --shadow:0 1px 3px rgba(30,36,43,.06),0 1px 2px rgba(30,36,43,.04);
  --shadow-md:0 4px 12px rgba(30,36,43,.08),0 2px 4px rgba(30,36,43,.04);
  --shadow-lg:0 12px 32px rgba(30,36,43,.12),0 4px 8px rgba(30,36,43,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:inherit;text-decoration:none}
::selection{background:rgba(199,162,72,.25)}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--anthracite);color:#c8cdd3;display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.brand{padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--gold),var(--terra));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--anthracite);font-family:var(--mono)}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-0.01em}
.brand-sub{font-size:9px;color:rgba(255,255,255,.4);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.role-section{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.role-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);font-family:var(--mono);margin-bottom:8px;display:block}
.role-tabs{display:flex;flex-direction:column;gap:3px}
.role-tab{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-sm);font-size:12px;color:rgba(255,255,255,.6);transition:all .15s;text-align:left;font-weight:500}
.role-tab:hover{background:rgba(255,255,255,.06);color:#fff}
.role-tab.active{background:rgba(199,162,72,.14);color:var(--gold)}
.role-tab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.role-tab[data-role="exploitant"] .dot{background:var(--gold)}
.role-tab[data-role="coop"] .dot{background:var(--terra)}
.role-tab[data-role="agent"] .dot{background:#6b9bd8}
.nav-group-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);font-family:var(--mono);padding:14px 14px 7px;display:block}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;color:rgba(255,255,255,.55);transition:all .12s;font-weight:500;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff}
.nav-item .ico{width:15px;height:15px;flex-shrink:0;opacity:.7}
.nav-count{margin-left:auto;font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.4);background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px}
.sidebar-foot{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:rgba(255,255,255,.3);font-family:var(--mono);line-height:1.6}
.sidebar-foot a{color:var(--gold);opacity:.7}
.sidebar-foot a:hover{opacity:1}

.main{overflow-y:auto;background:var(--paper)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--gris2);border-radius:3px}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:-0.01em}
.topbar-role{font-size:10px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
.topbar-right{display:flex;align-items:center;gap:14px}
.topbar-meta{font-size:11px;font-family:var(--mono);color:var(--muted)}
.topbar-btn{font-size:11px;font-family:var(--mono);color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:5px;transition:all .15s;text-transform:uppercase;letter-spacing:.04em}
.topbar-btn:hover{border-color:var(--gold);color:var(--ink)}
.content{padding:24px;max-width:1280px}

/* ===== Cards & panels ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--anthracite)}
.card-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card-body{padding:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* ===== KPI cards ===== */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono)}
.kpi-val{font-size:26px;font-weight:600;font-family:var(--mono);margin:6px 0 2px;letter-spacing:-0.02em;color:var(--anthracite)}
.kpi-unit{font-size:13px;color:var(--muted);font-weight:400}
.kpi-delta{font-size:11px;font-family:var(--mono);margin-top:4px}
.kpi-delta.pos{color:var(--ok)}
.kpi-delta.neg{color:var(--err)}
.kpi-delta.neu{color:var(--muted)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:var(--r) 0 0 var(--r);background:var(--gris)}
.kpi.accent::before{background:var(--gold)}
.kpi.terra::before{background:var(--terra)}
.kpi.ok::before{background:var(--ok)}

/* ===== Tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--mono);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(199,162,72,.03)}
.tbl td .mono{font-family:var(--mono);font-size:11px}
.tbl td.num{font-family:var(--mono);text-align:right}
.tbl-wrap{overflow-x:auto}
.row-clickable{cursor:pointer}

/* ===== Badges & tags ===== */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.gold{background:rgba(199,162,72,.12);color:#8a7126;border:1px solid rgba(199,162,72,.2)}
.tag.terra{background:rgba(181,98,62,.1);color:#8a4a30;border:1px solid rgba(181,98,62,.2)}
.tag.ok{background:rgba(45,125,70,.08);color:var(--ok);border:1px solid rgba(45,125,70,.15)}
.tag.warn{background:rgba(184,134,47,.1);color:var(--warn);border:1px solid rgba(184,134,47,.2)}
.tag.err{background:rgba(169,56,41,.08);color:var(--err);border:1px solid rgba(169,56,41,.15)}
.tag.neu{background:var(--gris);color:var(--muted);border:1px solid var(--line)}
.tag.info{background:rgba(107,155,216,.08);color:#4a7cb8;border:1px solid rgba(107,155,216,.15)}
.prov{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:3px;font-weight:600}
.prov.saisi{background:rgba(45,125,70,.1);color:var(--ok)}
.prov.extrait{background:rgba(107,155,216,.1);color:#4a7cb8}
.prov.deduit{background:rgba(199,162,72,.12);color:#8a7126}
.prov.confirme{background:rgba(181,98,62,.1);color:#8a4a30}

/* ===== Forms ===== */
.form-row{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label.fld{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--mono);margin-bottom:5px;font-weight:500}
label.fld .req{color:var(--terra)}
label.fld .opt{color:var(--muted);opacity:.6;font-weight:400}
input.fld,select.fld,textarea.fld{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;font-size:13px;color:var(--ink);transition:border .15s;outline:none}
input.fld:focus,select.fld:focus,textarea.fld:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(199,162,72,.12)}
input.fld.invalid{border-color:var(--err);background:rgba(169,56,41,.03)}
input.fld.mono,select.fld.mono{font-family:var(--mono);font-size:12px}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:5px;font-size:12px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--anthracite);color:#fff}
.btn-primary:hover{background:#2d3640}
.btn-gold{background:var(--gold);color:var(--anthracite)}
.btn-gold:hover{background:#d4b05a}
.btn-outline{border:1px solid var(--line2);color:var(--ink);background:#fff}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-terra{background:var(--terra);color:#fff}
.btn-terra:hover{background:#c4714f}
.btn-sm{padding:5px 11px;font-size:11px}
.btn-ghost{color:var(--muted);font-size:11px;padding:4px 8px}
.btn-ghost:hover{color:var(--ink)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(30,36,43,.4);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:780px;width:100%;margin:0 auto}
.modal-head{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;color:var(--anthracite)}
.modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.modal-body{padding:24px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:18px;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--gris);color:var(--ink)}

/* ===== Agent flow ===== */
.flow-steps{display:flex;gap:0;margin-bottom:20px;flex-wrap:wrap}
.flow-step{flex:1;min-width:120px;position:relative;padding:10px 12px;border-top:2px solid var(--line);font-size:11px;transition:all .2s}
.flow-step .step-n{font-size:9px;font-family:var(--mono);color:var(--muted)}
.flow-step .step-t{font-weight:600;margin-top:2px;color:var(--ink)}
.flow-step.active{border-top-color:var(--gold);background:rgba(199,162,72,.04)}
.flow-step.done{border-top-color:var(--ok)}
.flow-step.done .step-n{color:var(--ok)}
.flow-step.done .step-t{color:var(--ok)}

.flow-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;min-height:300px}
.flow-step-title{font-size:16px;font-weight:600;margin-bottom:4px}
.flow-step-desc{font-size:12px;color:var(--muted);margin-bottom:16px}
.flow-field{display:grid;grid-template-columns:180px 1fr 90px 80px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.flow-field:last-child{border-bottom:none}
.flow-field .ff-label{font-weight:500}
.flow-field .ff-val{font-family:var(--mono);font-size:11px}
.conf-bar{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono)}
.conf-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conf-hi{background:var(--ok)}
.conf-md{background:var(--warn)}
.conf-lo{background:var(--err)}

/* ===== Chat ===== */
.chat-wrap{display:grid;grid-template-columns:1fr 280px;height:calc(100vh - 52px);overflow:hidden}
.chat-main{display:flex;flex-direction:column;overflow:hidden}
.chat-trace{border-left:1px solid var(--line);overflow-y:auto;background:var(--paper)}
.chat-trace-head{padding:12px 16px;border-bottom:1px solid var(--line);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chat-msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.chat-msg{display:flex;gap:10px;max-width:80%}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse}
.chat-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono)}
.chat-msg.agent .chat-avatar{background:var(--anthracite);color:var(--gold)}
.chat-msg.user .chat-avatar{background:var(--gold);color:var(--anthracite)}
.chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
.chat-msg.agent .chat-bubble{background:#fff;border:1px solid var(--line)}
.chat-msg.user .chat-bubble{background:var(--anthracite);color:#e2e5e0}
.chat-bubble .mono{font-family:var(--mono);font-size:11px;background:rgba(199,162,72,.08);padding:1px 5px;border-radius:3px;color:var(--gold)}
.chat-bubble .reg{display:block;margin-top:6px;padding:8px;border-radius:6px;background:var(--gris);border:1px solid var(--line)}
.chat-bubble .reg .rh{font-size:10px;font-family:var(--mono);color:var(--muted);margin-bottom:4px}
.chat-bubble .reg .rt{font-size:12px;font-family:var(--mono);color:var(--ink);line-height:1.6}
.chat-input{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;background:#fff}
.chat-input input{flex:1;padding:9px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);font-size:13px;outline:none}
.chat-input input:focus{border-color:var(--gold)}
.chat-suggestions{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px;background:#fff}
.chat-sug{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;color:var(--muted);transition:all .15s}
.chat-sug:hover{border-color:var(--gold);color:var(--gold)}
.trace-item{padding:10px 16px;border-bottom:1px solid var(--line);font-size:11px}
.trace-item .tt{font-family:var(--mono);color:var(--muted);font-size:10px}
.trace-item .ta{color:var(--ink);margin-top:3px;line-height:1.45}
.trace-item .ta .mono{font-family:var(--mono);font-size:10px;background:var(--gris);padding:1px 4px;border-radius:3px}

/* ===== Alerts ===== */
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r-sm);border:1px solid;font-size:12px;margin-bottom:8px}
.alert.err{border-color:rgba(169,56,41,.2);background:rgba(169,56,41,.04)}
.alert.warn{border-color:rgba(184,134,47,.2);background:rgba(184,134,47,.04)}
.alert.ok{border-color:rgba(45,125,70,.2);background:rgba(45,125,70,.04)}
.alert .ai{flex-shrink:0;width:20px;text-align:center;font-size:14px}
.alert .at{font-weight:600;margin-bottom:2px}
.alert .ad{color:var(--muted);font-size:11px;font-family:var(--mono)}

/* ===== Misc ===== */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--mono);margin-bottom:10px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:18px 0}
.pac-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.pac-cell{text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:11px}
.pac-cell .pl{font-size:9px;font-family:var(--mono);color:var(--muted);text-transform:uppercase}
.pac-cell .pv{font-size:18px;font-family:var(--mono);font-weight:600;color:var(--anthracite);margin:4px 0 2px}
.pac-cell.ok{border-color:rgba(45,125,70,.25);background:rgba(45,125,70,.03)}
.pac-cell.warn{border-color:rgba(184,134,47,.3);background:rgba(184,134,47,.03)}
.pac-cell.err{border-color:rgba(169,56,41,.25);background:rgba(169,56,41,.03)}
.compliance-bar{height:6px;border-radius:3px;background:var(--gris);overflow:hidden;margin-top:4px}
.compliance-fill{height:100%;border-radius:3px;transition:width .5s}
.hidden{display:none!important}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--anthracite);color:#fff;padding:10px 16px;border-radius:6px;font-size:12px;box-shadow:var(--shadow-lg);animation:slideIn .25s ease;display:flex;align-items:center;gap:8px}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes typing{0%,100%{opacity:.3}50%{opacity:1}}
.typing{animation:typing 1s infinite}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--anthracite);border-bottom-color:var(--gold)}
.scroll-y{overflow-y:auto}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-name">Ceres</div>
        <div class="brand-sub">FarmCockpit</div>
      </div>
    </div>
    <div class="role-section">
      <span class="role-label">Role</span>
      <div class="role-tabs">
        <button class="role-tab active" data-role="exploitant" onclick="switchRole('exploitant')"><span class="dot"></span>Exploitant</button>
        <button class="role-tab" data-role="coop" onclick="switchRole('coop')"><span class="dot"></span>Coopérative</button>
        <button class="role-tab" data-role="agent" onclick="switchRole('agent')"><span class="dot"></span>Agent</button>
      </div>
    </div>
    <div id="navExploitant">
      <div class="nav-group-label">Exploitation</div>
      <div class="nav">
        <button class="nav-item active" data-view="dashboard" onclick="navTo('dashboard')"><span class="ico">▣</span>Tableau de bord</button>
        <button class="nav-item" data-view="parcelles" onclick="navTo('parcelles')"><span class="ico">▤</span>Parcelles<span class="nav-count" id="cnt-parc">6</span></button>
        <button class="nav-item" data-view="registre" onclick="navTo('registre')"><span class="ico">▦</span>Registre phyto<span class="nav-count" id="cnt-reg">0</span></button>
        <button class="nav-item" data-view="flux" onclick="navTo('flux')"><span class="ico">↻</span>Flux agentique</button>

function pacConformite() {
  let ok = 0, total = 0;
  PARCELLES.forEach(p => {
    const checks = [p.surface >= 5, p.culture !== 'BRAAN' || p.surface < 20, true, p.ilot !== '9999'];
    checks.forEach(c => { total++; if (c) ok++; });
  });
  return Math.round((ok / total) * 100);
}

function pacComplianceGrid() {
  const checks = ['Bande enherbée', 'Rotation', 'Prairie perm.', 'N RPG'];
  return `<table class="tbl"><thead><tr><th>Parcelle</th>${checks.map(c => `<th style="text-align:center">${c}</th>`).join('')}</tr></thead><tbody>
  ${PARCELLES.map(p => `<tr><td class="mono">${p.ilot}/${p.parcelle} ${p.nom}</td>
    <td style="text-align:center"><span class="tag ok">✓</span></td>

    <td style="text-align:center">${p.culture==='BRAAN'?'<span class="tag warn">N/A</span>':'<span class="tag ok">✓</span>'}</td>

        <div class="form-row"><label class="fld">Stade BBCH <span class="req">*</span></label><select class="fld" id="f-bbch">${Object.entries(BBCH).map(([n,d])=>`<option value="${n}">${n} · ${d}</option>`).join('')}</select></div>
        <div class="form-row"><label class="fld">Conduite biologique <span class="req">*</span></label><select class="fld" id="f-bio"><option value="non">non</option><option value="oui">oui</option></select></div>
        <div class="form-row"></div>
      </div>

    </div>
  `;
  document.getElementById('modal-content').innerHTML = html;

}

function onProduitChange() {
  const sel = document.getElementById('f-produit');
  const amm = sel.value;
  const ammEl = document.getElementById('f-amm');
  const doseEl = document.getElementById('f-dose');
  const doseUniteEl = document.getElementById('f-dose-unite');
  ammEl.value = amm;
  if (amm && AMM_DB[amm]) {
    doseEl.value = AMM_DB[amm].dose;
    doseUniteEl.textContent = AMM_DB[amm].unite;
  }
}

function onParcelleChange() {
  const sel = document.getElementById('f-parcelle');
  const idx = parseInt(sel.value);
  if (isNaN(idx)) return;
  const p = PARCELLES[idx];
  document.getElementById('f-gps').value = p.gps;
  document.getElementById('f-surface').value = p.surface.toFixed(1);
  document.getElementById('f-surface-h').textContent = p.surface + ' ha';
  document.getElementById('f-culture').value = p.culture;
}

function saveRegEntry() {
  const amm = document.getElementById('f-amm').value;
  const pIdx = parseInt(document.getElementById('f-parcelle').value);
  if (!amm || isNaN(pIdx)) { toast('Champs obligatoires manquants'); return; }
  const p = PARCELLES[pIdx];
  const d = AMM_DB[amm];
  const dateVal = document.getElementById('f-date').value;
  const entry = {
    id: uid(),
    siretDetenteur: document.getElementById('f-siretDet').value,
    siretBeneficiaire: document.getElementById('f-siretBen').value,
    produit: d.produit,
    amm: amm,
    dateUtilisation: dateVal ? new Date(dateVal).toLocaleDateString('fr-FR') : todayFR(),
    horaireDebut: document.getElementById('f-hdeb').value || (d.horaire ? '07:00' : ''),
    horaireFin: document.getElementById('f-hfin').value || (d.horaire ? '09:00' : ''),
    delaiRentree: document.getElementById('f-delai').value,
    dose: parseFloat(document.getElementById('f-dose').value || d.dose),
    doseUnite: d.unite,
    cible: document.getElementById('f-cible').value || '',
    modeApplication: document.getElementById('f-mode').value || '',
    ilot: p.ilot, parcelle: p.parcelle, insee: p.insee,
    nomParcelle: p.nom, commune: p.commune,
    localisation: p.ilot + '/' + p.parcelle + '/' + p.insee,
    gps: p.gps,
    surface: p.surface,
    culture: p.culture,
    bbch: document.getElementById('f-bbch').value,
    biologique: document.getElementById('f-bio').value,
    provenance: 'saisi',
    timestamp: nowISO(),
    version: 1,
    author: 'exploitant',
  };
  REGISTRE.push(entry);
  addTrace('REGISTRE', 'Ajout manuel: ' + d.produit + ' sur ' + p.ilot + '/' + p.parcelle + ' (' + p.surface + 'ha)');
  closeModal();
  toast('Utilisation enregistrée · ' + d.produit);
  render();
}

function showRegDetail(id) {
  const r = REGISTRE.find(e => e.id === id);
  if (!r) return;
  const rows17 = [
    ['SIRET détenteur', r.siretDetenteur],
    ['SIRET bénéficiaire', r.siretBeneficiaire],
    ['Produit', r.produit],
    ['AMM', r.amm],
    ['Date d\'utilisation', r.dateUtilisation],
    ['Horaire début', r.horaireDebut || '·'],
    ['Horaire fin', r.horaireFin || '·'],
    ['Délai rentrée anticipée', r.delaiRentree],
    ['Dose', r.dose + ' ' + r.doseUnite],
    ['Cible', r.cible || '·'],
    ['Mode d\'application', r.modeApplication || '·'],
    ['Localisation RPG', r.localisation],
    ['GPS WGS84', r.gps],
    ['Surface traitée', r.surface + ' ha'],
    ['Culture', r.culture + ' (' + (OEPP[r.culture]||'') + ')'],

  ];
  const html = `
    <div class="modal-head"><div><div class="modal-title">Détail utilisation · ${r.id}</div><div class="modal-sub">v${r.version} · ${r.timestamp} · ${r.provenance}</div></div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <table class="tbl"><tbody>
      ${rows17.map(([l,v]) => `<tr><td style="width:220px;font-weight:500">${l}</td><td class="mono">${v}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="modal-foot"><span class="hint">Conservation 5 ans · IA Act art 50(1)</span><button class="btn btn-outline" onclick="closeModal()">Fermer</button></div>
  `;
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

/* ============================================================
   FLUX AGENTIQUE : 7 étapes
   ============================================================ */
function viewFlux() {
  return `
  <div class="flow-steps">
    <div class="flow-step ${flowStep===0?'active':''}" id="fs-0"><div class="step-n">01</div><div class="step-t">Extraction</div></div>
    <div class="flow-step" id="fs-1"><div class="step-n">02</div><div class="step-t">Réconciliation</div></div>
    <div class="flow-step" id="fs-2"><div class="step-n">03</div><div class="step-t">Contrôles</div></div>
    <div class="flow-step" id="fs-3"><div class="step-n">04</div><div class="step-t">Questions</div></div>
    <div class="flow-step" id="fs-4"><div class="step-n">05</div><div class="step-t">Validation</div></div>
    <div class="flow-step" id="fs-5"><div class="step-n">06</div><div class="step-t">Registre</div></div>
    <div class="flow-step" id="fs-6"><div class="step-n">07</div><div class="step-t">Exports</div></div>
  </div>
  <div class="flow-panel" id="flow-panel"></div>
  <div id="flow-controls" style="margin-top:14px;display:flex;justify-content:space-between"></div>
  `;
}

function initFlux() {
  flowStep = 0;
  flowData = null;
  renderFlowStep();
}

function updateFlowSteps() {
  for (let i = 0; i < 7; i++) {
    const el = document.getElementById('fs-' + i);
    if (!el) continue;
    el.classList.remove('active', 'done');
    if (i < flowStep) el.classList.add('done');
    else if (i === flowStep) el.classList.add('active');
  }
}

function renderFlowStep() {
  updateFlowSteps();
  const panel = document.getElementById('flow-panel');
  const controls = document.getElementById('flow-controls');
  const steps = [flowExtraction, flowReconciliation, flowControles, flowQuestions, flowValidation, flowRegistre, flowExports];
  steps[flowStep](panel, controls);
}

function flowExtraction(panel, controls) {
  // Simulated source: a photo/scan with partial data
  if (!flowData) {
    flowData = {
      source: 'scan_ticket_2026-04-15.jpg',
      raw: {
        siretDetenteur: { val: SIRET_DETENTEUR, conf: 0.99 },
        siretBeneficiaire: { val: '', conf: 0.0 },
        produit: { val: 'MODDUS', conf: 0.92 },
        amm: { val: '9400352', conf: 0.88 },
        dateUtilisation: { val: '15/04/2026', conf: 0.75 },
        horaireDebut: { val: '07:30', conf: 0.60 },
        horaireFin: { val: '09:00', conf: 0.60 },
        delaiRentree: { val: '06:00', conf: 0.50 },
        dose: { val: '0.8', conf: 0.85 },
        cible: { val: '', conf: 0.0 },
        modeApplication: { val: 'pulvérisation', conf: 0.70 },
        ilot: { val: '1001', conf: 0.95 },
        parcelle: { val: '3', conf: 0.95 },
        insee: { val: '15001', conf: 0.90 },
        gps: { val: '', conf: 0.0 },
        surface: { val: '', conf: 0.0 },
        culture: { val: 'TRZAX', conf: 0.80 },
        bbch: { val: '', conf: 0.0 },
        biologique: { val: 'non', conf: 0.95 },
      }
    };
  }
  const fields = flowData.raw;
  const rows = Object.entries(fields).map(([k,v]) => {
    const cls = v.conf >= 0.8 ? 'conf-hi' : v.conf >= 0.5 ? 'conf-md' : 'conf-lo';
    const pct = Math.round(v.conf * 100);
    return `<div class="flow-field">
      <div class="ff-label">${fieldLabel(k)}</div>
      <div class="ff-val">${v.val || '<span class="muted">·</span>'}</div>
      <div><span class="conf-bar"><span class="conf-dot ${cls}"></span> ${pct}%</span></div>
      <div>${v.val ? '<span class="prov extrait">extrait</span>' : '<span class="tag neu">manquant</span>'}</div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="flow-step-title">01 · Extraction</div>
    <div class="flow-step-desc">Source: <span class="mono">${flowData.source}</span> : extraction des champs bruts avec score de confiance par champ. Les champs sous le seuil (60%) seront demandés à l\'exploitant à l\'étape 4.</div>
    <div>${rows}</div>
  `;
  controls.innerHTML = `<div></div><button class="btn btn-gold" onclick="nextFlow()">Étape suivante →</button>`;
}

function flowReconciliation(panel, controls) {
  const r = flowData.raw;
  const amm = r.amm.val;
  const ammInfo = AMM_DB[amm];
  const ilot = r.ilot.val, parcelle = r.parcelle.val, insee = r.insee.val;
  const parcMatch = PARCELLES.find(p => p.ilot === ilot && p.parcelle === parcelle && p.insee === insee);

  panel.innerHTML = `
    <div class="flow-step-title">02 · Réconciliation</div>
    <div class="flow-step-desc">Correspondance vers les référentiels: E-Phy (AMM), RPG (parcelle), OEPP (culture).</div>
    <div class="card-body">
      <div class="form-row"><strong>Produit → AMM (E-Phy ANSES)</strong><div class="hint">AMM ${amm} → ${ammInfo ? ammInfo.produit + ' · ' + ammInfo.substance + ' · dose ref ' + ammInfo.dose + ' ' + ammInfo.unite : '<span class="tag err">non trouvé</span>'}</div></div>
      <div class="form-row"><strong>Parcelle → RPG</strong><div class="hint">ilot ${ilot} / parcelle ${parcelle} / INSEE ${insee} → ${parcMatch ? 'OK · ' + parcMatch.nom + ' · ' + parcMatch.surface + 'ha · ' + parcMatch.commune : '<span class="tag err">non trouvé dans RPG</span>'}</div></div>
      <div class="form-row"><strong>Culture → OEPP</strong><div class="hint">${r.culture.val} → ${OEPP[r.culture.val] || 'code inconnu'} ${ammInfo && ammInfo.cultures.includes(r.culture.val) ? '<span class="tag ok">autorisé pour AMM</span>' : '<span class="tag warn">vérifier compatibilité</span>'}</div></div>
    </div>
  `;
  // Update reconciled fields
  if (parcMatch) { r.surface.val = parcMatch.surface; r.surface.conf = 0.99; r.gps.val = parcMatch.gps; r.gps.conf = 0.99; }
  if (ammInfo) { r.dose.val = ammInfo.dose; r.dose.conf = 0.95; r.doseUnite = ammInfo.unite; }
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()">← Retour</button><button class="btn btn-gold" onclick="nextFlow()">Étape suivante →</button>`;
}

function flowControles(panel, controls) {
  const r = flowData.raw;
  const amm = r.amm.val;
  const ammInfo = AMM_DB[amm];
  const parc = PARCELLES.find(p => p.ilot === r.ilot.val && p.parcelle === r.parcelle.val && p.insee === r.insee.val);
  const dose = parseFloat(r.dose.val);
  const surface = parc ? parc.surface : 0;
  const qtyNeeded = dose * surface;
  const checks = [
    { label: 'Dose × surface ≤ quantité disponible', ok: true, detail: dose + ' ' + ammInfo.unite + ' × ' + surface + ' ha = ' + qtyNeeded.toFixed(2) + ' ' + ammInfo.unite },
    { label: 'AMM valide à la date', ok: true, detail: 'AMM ' + amm + ' actif au ' + r.dateUtilisation.val },
    { label: 'Produit autorisé pour culture', ok: ammInfo.cultures.includes(r.culture.val), detail: ammInfo.produit + ' autorisé sur ' + (OEPP[r.culture.val]||r.culture.val) + ' ? ' + (ammInfo.cultures.includes(r.culture.val) ? 'OUI' : 'NON') },
    { label: 'Parcelle RPG existe', ok: !!parc, detail: parc ? 'ilot ' + r.ilot.val + '/' + r.parcelle.val + ' trouvé' : 'non trouvé' },
    { label: 'AMM exige horaire', ok: !ammInfo.horaire || (r.horaireDebut.val && r.horaireFin.val), detail: ammInfo.horaire ? 'Horaires requis et présents' : 'Non requis' },
  ];

  panel.innerHTML = `
    <div class="flow-step-title">03 · Contrôles réglementaires</div>
    <div class="flow-step-desc">Vérification automatique: dose, validité AMM, autorisation culture, existence RPG.</div>
    <div>${checks.map(c => `<div class="alert ${c.ok?'ok':'err'}"><div class="ai">${c.ok?'✓':'✕'}</div><div><div class="at">${c.label}</div><div class="ad">${c.detail}</div></div></div>`).join('')}</div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()">← Retour</button><button class="btn btn-gold" onclick="nextFlow()">Étape suivante →</button>`;
}

function flowQuestions(panel, controls) {
  const r = flowData.raw;
  // Fields below threshold or missing
  const missing = Object.entries(r).filter(([k,v]) => v.conf < 0.6 && !v.val);
  const low = Object.entries(r).filter(([k,v]) => v.conf < 0.6 && v.val);

  panel.innerHTML = `
    <div class="flow-step-title">04 · Questions à l\'exploitant</div>
    <div class="flow-step-desc">L\'agent demande SEULEMENT les champs manquants ou sous le seuil de confiance (60%). Ne devine jamais.</div>
    <div class="alert warn"><div class="ai">?</div><div><div class="at">Champs à confirmer</div><div class="ad">${missing.length + low.length} champ(s) sous le seuil</div></div></div>
    ${(missing.length ? missing : low).map(([k,v]) => `<div class="form-row">
      <label class="fld">${fieldLabel(k)} ${v.val ? '<span class="opt">(conf ' + Math.round(v.conf*100) + '%)</span>' : '<span class="req">*</span>'}</label>
      <input class="fld mono" id="qf-${k}" value="${v.val||''}" placeholder="${fieldLabel(k)}">
    </div>`).join('')}
    <div class="hint">L\'agent ne complète jamais un champ qu\'il ne peut pas déduire. Il demande.</div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()">← Retour</button><button class="btn btn-gold" onclick="collectQuestions(); nextFlow();">Confirmer →</button>`;
}

function collectQuestions() {
  const r = flowData.raw;
  Object.keys(r).forEach(k => {
    const el = document.getElementById('qf-' + k);
    if (el && el.value) { r[k].val = el.value; r[k].conf = 1.0; r[k].confirmed = true; }
  });
}

function flowValidation(panel, controls) {
  const r = flowData.raw;
  const rows = Object.entries(r).map(([k,v]) => {
    const prov = v.confirmed ? 'confirme' : v.conf >= 0.8 ? 'extrait' : v.conf >= 0.5 ? 'deduit' : 'saisi';
    return `<div class="flow-field">
      <div class="ff-label">${fieldLabel(k)}</div>
      <div class="ff-val">${v.val || '<span class="muted">·</span>'}</div>
      <div><span class="conf-bar"><span class="conf-dot ${v.conf>=0.8?'conf-hi':v.conf>=0.5?'conf-md':'conf-lo'}"></span> ${Math.round(v.conf*100)}%</span></div>
      <div><span class="prov ${prov}">${prov}</span></div>
    </div>`;
  }).join('');

  panel.innerHTML = `
    <div class="flow-step-title">05 · Validation exploitants</div>
    <div class="flow-step-desc">L\'exploitant confirme chaque champ. Provenance: saisi / extrait / déduit / confirmé.</div>
    <div>${rows}</div>
    <div class="alert ok"><div class="ai">✓</div><div><div class="at">Tous les champs obligatoires sont remplis</div><div class="ad">L\'exploitant valide le registre</div></div></div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()">← Retour</button><button class="btn btn-gold" onclick="nextFlow()">Valider et enregistrer →</button>`;
}

function flowRegistre(panel, controls) {
  const r = flowData.raw;
  const parc = PARCELLES.find(p => p.ilot === r.ilot.val && p.parcelle === r.parcelle.val);
  const ammInfo = AMM_DB[r.amm.val];
  if (!flowData.registered) {
    const entry = {
      id: uid(),
      siretDetenteur: r.siretDetenteur.val,
      siretBeneficiaire: r.siretBeneficiaire.val || SIRET_BENEF,
      produit: ammInfo.produit,
      amm: r.amm.val,
      dateUtilisation: r.dateUtilisation.val,
      horaireDebut: r.horaireDebut.val,
      horaireFin: r.horaireFin.val,
      delaiRentree: r.delaiRentree.val,
      dose: parseFloat(r.dose.val),
      doseUnite: ammInfo.unite,
      cible: r.cible.val,
      modeApplication: r.modeApplication.val,
      ilot: r.ilot.val, parcelle: r.parcelle.val, insee: r.insee.val,
      nomParcelle: parc ? parc.nom : '', commune: parc ? parc.commune : '',
      localisation: r.ilot.val + '/' + r.parcelle.val + '/' + r.insee.val,
      gps: parc ? parc.gps : r.gps.val,
      surface: parc ? parc.surface : parseFloat(r.surface.val),
      culture: r.culture.val,
      bbch: r.bbch.val,
      biologique: r.biologique.val,
      provenance: 'confirme',
      timestamp: nowISO(),
      version: 1,
      author: 'agent-ceres',
    };
    REGISTRE.push(entry);
    flowData.registered = true;
    flowData.entryId = entry.id;
    addTrace('REGISTRE', 'Flux agentique: ' + ammInfo.produit + ' sur ' + r.ilot.val + '/' + r.parcelle.val + ' (v' + entry.version + ')');
    updateRegCount();
  }

  panel.innerHTML = `
    <div class="flow-step-title">06 · Registre immuable</div>
    <div class="flow-step-desc">Événement versionné horodaté. Toute correction = nouvelle version. Conservation 5 ans.</div>
    <div class="card-body">
      <div class="form-row"><strong>ID: <span class="mono">${flowData.entryId}</span></strong></div>
      <div class="form-row"><strong>Version:</strong> 1 · <strong>Auteur:</strong> agent-ceres · <strong>Timestamp:</strong> <span class="mono">${nowISO()}</span></div>
      <div class="form-row"><strong>Provenance:</strong> <span class="prov confirme">confirmé</span> (tous champs)</div>
      <div class="divider"></div>
      <table class="tbl"><tbody>
        <tr><td>Produit</td><td>${ammInfo.produit} (AMM ${r.amm.val})</td></tr>
        <tr><td>Dose</td><td class="mono">${r.dose.val} ${ammInfo.unite}</td></tr>
        <tr><td>Parcelle</td><td class="mono">${r.ilot.val}/${r.parcelle.val} ${parc?parc.nom:''}</td></tr>
        <tr><td>Surface</td><td class="mono">${parc?parc.surface:''} ha</td></tr>
        <tr><td>Date</td><td class="mono">${r.dateUtilisation.val}</td></tr>
        <tr><td>Culture / BBCH</td><td class="mono">${r.culture.val} / ${r.bbch.val}</td></tr>
      </tbody></table>
    </div>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()">← Retour</button><button class="btn btn-gold" onclick="nextFlow()">Exporter →</button>`;
}

function flowExports(panel, controls) {
  panel.innerHTML = `
    <div class="flow-step-title">07 · Exports</div>
    <div class="flow-step-desc">CSV (UTF-8, une ligne par utilisation, 17 colonnes), JSON (schema_version), PDF (en-tête SIRET + période).</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">
      <button class="btn btn-gold" onclick="exportCSV()">↓ Export CSV (17 colonnes, UTF-8)</button>
      <button class="btn btn-gold" onclick="exportJSON()">↓ Export JSON (schema_version)</button>
      <button class="btn btn-gold" onclick="exportPDFSim()">↓ Export PDF (en-tête SIRET)</button>
    </div>
    <div class="divider"></div>
    <div class="section-title">Aperçu CSV (5 premières lignes)</div>
    <pre class="mono" style="font-size:10px;background:var(--anthracite);color:#c8cdd3;padding:14px;border-radius:var(--r);overflow-x:auto;max-height:300px">${csvPreview()}</pre>
  `;
  controls.innerHTML = `<button class="btn btn-outline" onclick="prevFlow()">← Retour</button><button class="btn btn-outline" onclick="initFlux()">↻ Recommencer</button><button class="btn btn-gold" onclick="navTo('registre')">Voir registre →</button>`;
}

function nextFlow() { if (flowStep < 6) { flowStep++; renderFlowStep(); } }
function prevFlow() { if (flowStep > 0) { flowStep--; renderFlowStep(); } }

function fieldLabel(k) {
  const map = {
    siretDetenteur:'SIRET détenteur', siretBeneficiaire:'SIRET bénéficiaire',
    produit:'Produit', amm:'AMM', dateUtilisation:'Date', horaireDebut:'H. début', horaireFin:'H. fin',
    delaiRentree:'Délai rentrée', dose:'Dose', cible:'Cible', modeApplication:'Mode application',
    ilot:'Ilot', parcelle:'Parcelle', insee:'INSEE', gps:'GPS', surface:'Surface', culture:'Culture', bbch:'BBCH', biologique:'Bio',
  };
  return map[k] || k;
}

/* ============================================================
   PAC
   ============================================================ */

  return `

        <div><div class="kpi-label">Parcelles</div><div class="kpi-val">${PARCELLES.length}</div></div>
        <div><div class="kpi-label">DPU estimé</div><div class="kpi-val">${(total*73.5).toFixed(0)}<span class="kpi-unit"> €</span></div></div>
        <div><div class="kpi-label">Conformité BCAE</div><div class="kpi-val">${pacConformite()}<span class="kpi-unit">%</span></div></div>

function viewCarto() {
  // Text-based compliance map
  const communes = {};
  PARCELLES.forEach(p => {
    if (!communes[p.commune]) communes[p.commune] = { surface: 0, count: 0 };
    communes[p.commune].surface += p.surface;
    communes[p.commune].count++;
  });
  ADHERENTS.forEach(a => {
    const c = a.nom.includes('Margeride') ? 'Margeride' : a.nom.includes('Planèze') ? 'Planèze' : 'Cantal';
    if (!communes[c]) communes[c] = { surface: a.surface, count: a.parcelles };
  });

  return `<div class="card"><div class="card-head"><div class="card-title">Carto conformité · Cantal (15)</div><div class="card-sub">par commune · RPG 2026</div></div><div class="card-body">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
      ${Object.entries(communes).map(([c,d])=>`<div style="border:1px solid var(--line);border-radius:var(--r-sm);padding:14px"><div style="font-weight:600">${c}</div><div class="mono" style="font-size:11px;color:var(--muted);margin:6px 0">${d.count} parcelles · ${d.surface.toFixed(1)} ha</div><div class="compliance-bar"><div class="compliance-fill" style="width:${75+Math.random()*24}%;background:var(--gold)"></div></div></div>`).join('')}
    </div>
  </div></div>`;
}

/* ============================================================
   AGENT CHAT
   ============================================================ */
function renderChat() {
  const main = document.querySelector('.main');
  main.innerHTML = `
    <div class="topbar">
      <div class="topbar-left"><h1>Conversation agent</h1><span class="topbar-role">Agent Ceres</span></div>
      <div class="topbar-right"><span class="topbar-meta">Agent Ceres · GLM-5.2 · IA Act art 50(1)</span></div>
    </div>
    <div class="chat-wrap">
      <div class="chat-main">
        <div class="chat-msgs" id="chat-msgs"></div>
        <div class="chat-suggestions" id="chat-sug">
          <button class="chat-sug" onclick="chatSend('Ajoute MODDUS sur Grand Champ le 15/04/2026')">Ajoute MODDUS sur Grand Champ</button>
          <button class="chat-sug" onclick="chatSend('Liste mes parcelles')">Liste mes parcelles</button>
          <button class="chat-sug" onclick="chatSend('Exporte le registre en CSV')">Exporte le registre</button>
          <button class="chat-sug" onclick="chatSend('Quelle est ma conformité PAC ?')">Conformité PAC</button>
          <button class="chat-sug" onclick="chatSend('Prépare ma déclaration PAC')">Prépare déclaration PAC</button>
        </div>
        <div class="chat-input">
          <input id="chat-input" placeholder="Demandez à Ceres..." onkeydown="if(event.key==='Enter')chatSend(this.value)">
          <button class="btn btn-gold" onclick="chatSend(document.getElementById('chat-input').value)">Envoyer</button>
        </div>
      </div>
      <div class="chat-trace">
        <div class="chat-trace-head">Actions tracées</div>
        <div id="trace-list">${renderTraceItems()}</div>
      </div>
    </div>
  `;
  if (chatHistory.length === 0) {
    addChatMsg('agent', 'Bonjour, je suis Ceres, votre agent admin. Je peux enregistrer des utilisations phyto, préparer votre PAC, vérifier la conformité. Transparence IA Act art 50(1): chaque action est tracée et provable. Que puis-je faire pour vous ?');
  } else {
    chatHistory.forEach(m => appendChatMsg(m.role, m.text));
  }
}

function addChatMsg(role, text) {
  chatHistory.push({ role, text });
  appendChatMsg(role, text);
}

function appendChatMsg(role, text) {
  const msgs = document.getElementById('chat-msgs');
  if (!msgs) return;
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.innerHTML = `<div class="chat-avatar">${role === 'agent' ? 'C' : 'U'}</div><div class="chat-bubble">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function chatSend(text) {
  if (!text || !text.trim()) return;
  document.getElementById('chat-input').value = '';
  addChatMsg('user', text);
  // Typing indicator
  const msgs = document.getElementById('chat-msgs');
  const typing = document.createElement('div');
  typing.className = 'chat-msg agent';
  typing.id = 'typing';
  typing.innerHTML = '<div class="chat-avatar">C</div><div class="chat-bubble typing">Traitement...</div>';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(() => {
    document.getElementById('typing')?.remove();
    const reply = processAgent(text);
    addChatMsg('agent', reply);
    refreshTrace();
  }, 600);
}

function processAgent(input) {
  const t = input.toLowerCase();

  // Add utilisation
  if (t.includes('ajoute') || t.includes('enregistr') || t.includes('moddus') || t.includes('bell') || t.includes('cap osele')) {
    let amm = null, parcIdx = 0;
    if (t.includes('moddus')) amm = '9400352';
    else if (t.includes('bell')) amm = '20080037';
    else if (t.includes('carbrene')) amm = '9100776';
    else if (t.includes('korit')) amm = '8800461';
    else if (t.includes('cap osele') || t.includes('caposele')) amm = '20100063';
    else amm = Object.keys(AMM_DB)[0];

    const d = AMM_DB[amm];
    // Try to match parcelle by name in input
    PARCELLES.forEach((p, i) => { if (t.includes(p.nom.toLowerCase())) parcIdx = i; });
    const p = PARCELLES[parcIdx];

    // Date
    let dateStr = todayFR();
    const dateMatch = input.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (dateMatch) dateStr = dateMatch[0];

    const entry = {
      id: uid(), siretDetenteur: SIRET_DETENTEUR, siretBeneficiaire: SIRET_BENEF,
      produit: d.produit, amm: amm, dateUtilisation: dateStr,
      horaireDebut: d.horaire ? '07:30' : '', horaireFin: d.horaire ? '09:00' : '',
      delaiRentree: '06:00', dose: d.dose, doseUnite: d.unite,
      cible: '', modeApplication: 'pulvérisation',
      ilot: p.ilot, parcelle: p.parcelle, insee: p.insee, nomParcelle: p.nom, commune: p.commune,
      localisation: p.ilot + '/' + p.parcelle + '/' + p.insee, gps: p.gps,
      surface: p.surface, culture: p.culture, bbch: '32', biologique: 'non',
      provenance: 'saisi', timestamp: nowISO(), version: 1, author: 'agent-ceres',
    };
    REGISTRE.push(entry);
    updateRegCount();
    addTrace('REGISTRE', 'Chat: ' + d.produit + ' (AMM ' + amm + ') sur ' + p.ilot + '/' + p.parcelle + ' · ' + p.surface + 'ha');
    return `Utilisation enregistrée. <span class="mono">${d.produit}</span> (AMM ${amm}, ${d.dose} ${d.unite}) sur <span class="mono">${p.ilot}/${p.parcelle}</span> ${p.nom} (${p.surface} ha, ${OEPP[p.culture]||p.culture}).<div class="reg"><span class="rh">REGISTRE · v1 · ${nowISO()}</span><span class="rt">17 champs · provenance saisi · ID ${entry.id}</span></div>`;
  }

  // List parcelles
  if (t.includes('parcelle') || t.includes('liste')) {
    return `Vos ${PARCELLES.length} parcelles RPG:<div class="reg"><span class="rh">RPG · Cantal 15</span><span class="rt">${PARCELLES.map(p => p.ilot + '/' + p.parcelle + ' ' + p.nom + ' · ' + p.surface + 'ha · ' + OEPP[p.culture]).join('<br>')}</span></div>`;
  }

  // Export
  if (t.includes('export') || t.includes('csv') || t.includes('json')) {
    if (t.includes('json')) { exportJSON(); return 'Export JSON lancé (schema_version). Vérifiez vos téléchargements.'; }
    exportCSV();
    return `Export CSV lancé: ${REGISTRE.length} utilisation(s), 17 colonnes, UTF-8. Le fichier est téléchargé.`;
  }

  // PAC
  if (t.includes('pac') || t.includes('conformit') || t.includes('bcae')) {
    return `Conformité PAC: <span class="mono">${pacConformite()}%</span>. BCAE: bande enherbée ✓, rotation ✓, prairie permanente N/A (céréales), N RPG ✓. DPU estimé: <span class="mono">${(PARCELLES.reduce((s,p)=>s+p.surface,0)*73.5).toFixed(0)} €</span>. Pré-déclaration prête, l\'exploitant dépose sur TELEPAC mi-mai.<div class="reg"><span class="rh">PAC 2026 · Ceres prépare, humain déclare</span><span class="rt">Surface: ${PARCELLES.reduce((s,p)=>s+p.surface,0).toFixed(1)} ha · ${PARCELLES.length} parcelles</span></div>`;
  }

  // Registre count
  if (t.includes('registre') || t.includes('combien')) {
    return `Registre phyto: <span class="mono">${REGISTRE.length}</span> utilisation(s). Conservation 5 ans, arrete 24/12/2025 Annexe I.`;
  }

  // Default
  return `Je peux: enregistrer une utilisation phyto (\'ajoute MODDUS sur Grand Champ\'), lister vos parcelles, exporter le registre (CSV/JSON), vérifier la conformité PAC. Chaque action est tracée (IA Act art 50(1)).`;
}

/* ===== Trace ===== */
function addTrace(type, action) {
  AGENT_TRACE.push({ type, action, timestamp: nowISO() });
}
function renderTraceItems() {
  if (!AGENT_TRACE.length) return '<div class="trace-item" style="color:var(--muted)">Aucune action tracée</div>';
  return AGENT_TRACE.slice(-20).reverse().map(t => `<div class="trace-item"><div class="tt">${t.timestamp} · ${t.type}</div><div class="ta">${t.action}</div></div>`).join('');
}
function refreshTrace() {
  const el = document.getElementById('trace-list');
  if (el) el.innerHTML = renderTraceItems();
}

function viewTrace() {
  return `<div class="card"><div class="card-head"><div class="card-title">Actions tracées</div><div class="card-sub">IA Act art 50(1) · transparence</div></div><div class="card-body" style="padding:0">
  ${AGENT_TRACE.length ? `<table class="tbl"><thead><tr><th>Timestamp</th><th>Type</th><th>Action</th></tr></thead><tbody>
  ${AGENT_TRACE.slice().reverse().map(t=>`<tr><td class="mono">${t.timestamp}</td><td><span class="tag info">${t.type}</span></td><td>${t.action}</td></tr>`).join('')}
  </tbody></table>` : '<div class="empty">Aucune action tracée</div>'}
  </div></div>`;
}

/* ============================================================
   EXPORTS (réels)
   ============================================================ */
const CSV_HEADERS = [
  'siret_detenteur','siret_beneficiaire','produit','amm','date_utilisation',
  'horaire_debut','horaire_fin','delai_rentree_anticipee','dose','dose_unite',
  'cible','mode_application','ilot_rpg','parcelle_rpg','commune_insee',
  'gps_wgs84','surface_traitee_ha','culture_oepp','stade_bbch','conduite_biologique',
  'provenance','timestamp','version','author'
];

function buildCSV() {
  const rows = [CSV_HEADERS];
  REGISTRE.forEach(r => {
    rows.push([
      r.siretDetenteur, r.siretBeneficiaire, r.produit, r.amm, r.dateUtilisation,
      r.horaireDebut, r.horaireFin, r.delaiRentree, r.dose, r.doseUnite,
      r.cible, r.modeApplication, r.ilot, r.parcelle, r.insee,
      r.gps, r.surface, r.culture, r.bbch, r.biologique,
      r.provenance, r.timestamp, r.version, r.author
    ]);
  });
  // Add BOM for UTF-8 Excel compatibility
  return '\ufeff' + rows.map(row => row.map(c => {
    const s = String(c == null ? '' : c);
    return s.includes(';') || s.includes('"') ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(';')).join('\r\n');
}

function exportCSV() {
  if (REGISTRE.length === 0) { toast('Registre vide · rien à exporter'); return; }
  const csv = buildCSV();
  downloadFile('ceres_registre_phyto.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV exporté · ' + REGISTRE.length + ' ligne(s) · 17 colonnes');
  addTrace('EXPORT', 'CSV · ' + REGISTRE.length + ' lignes · 17 colonnes · UTF-8');
}

function csvPreview() {
  if (!REGISTRE.length) return 'Registre vide';
  const lines = buildCSV().split('\r\n').slice(0, 6);
  return lines.map(l => l.substring(0, 120) + (l.length > 120 ? '...' : '')).join('\n');
}

function buildJSON() {
  return JSON.stringify({
    schema_version: '1.0.0',
    arrete: '24/12/2025',
    annexe: 'I',
    generated_at: nowISO(),
    siret_coop: SIRET_DETENTEUR,
    count: REGISTRE.length,
    utilisations: REGISTRE.map(r => ({
      id: r.id, siret_detenteur: r.siretDetenteur, siret_beneficiaire: r.siretBeneficiaire,
      produit: r.produit, amm: r.amm, date_utilisation: r.dateUtilisation,
      horaire_debut: r.horaireDebut, horaire_fin: r.horaireFin, delai_rentree: r.delaiRentree,
      dose: r.dose, dose_unite: r.doseUnite, cible: r.cible, mode_application: r.modeApplication,
      ilot: r.ilot, parcelle: r.parcelle, commune_insee: r.insee, gps_wgs84: r.gps,
      surface_ha: r.surface, culture: r.culture, stade_bbch: r.bbch, conduite_biologique: r.biologique,
      provenance: r.provenance, timestamp: r.timestamp, version: r.version, author: r.author,
    })),
  }, null, 2);
}

function exportJSON() {
  const json = buildJSON();
  downloadFile('ceres_registre_phyto.json', json, 'application/json');
  toast('JSON exporté · schema_version 1.0.0');
  addTrace('EXPORT', 'JSON · schema_version 1.0.0 · ' + REGISTRE.length + ' entrées');
}

function exportPDFSim() {
  const header = 'CERES · REGISTRE PHYTO · SIRET ' + SIRET_DETENTEUR + ' · Période 2026 · ' + todayFR();
  const lines = [header, '', ...REGISTRE.map(r => r.dateUtilisation + ' | ' + r.produit + ' | AMM ' + r.amm + ' | ' + r.ilot + '/' + r.parcelle + ' | ' + r.surface + 'ha')];
  downloadFile('ceres_registre_phyto.txt', lines.join('\n'), 'text/plain');
  toast('PDF simulé (txt) · en-tête SIRET');
  addTrace('EXPORT', 'PDF (txt) · en-tête SIRET ' + SIRET_DETENTEUR);
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
